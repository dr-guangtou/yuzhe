# Provider registry: each entry = (api_key_env, base_url, default_model)
# client_type defaults to "openai"; set to "gemini" for Google AI only
# Add/remove providers here - zero code changes needed
providers:
  moonshot:
    api_key_env: "MOONSHOT_API_KEY"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "kimi-latest"

  kimi:
    api_key_env: "KIMI_API_KEY"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "kimi-latest"

  nvidia:
    api_key_env: "NVIDIA_API_KEY"
    base_url: "https://integrate.api.nvidia.com/v1"
    default_model: "moonshotai/kimi-k2.5"

  qwen:
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    default_model: "qwen-plus"

  glm:
    api_key_env: "GLM_API_KEY"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    default_model: "glm-4-flash"

  deepseek:
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    default_model: "deepseek-chat"

  openai:
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-4o-mini"

  gemini:
    api_key_env: "GEMINI_API_KEY"
    default_model: "gemini-2.0-flash"
    client_type: "gemini"

# LLM Configuration
# Primary provider (must exist in providers above)
llm:
  provider: "nvidia"
  model: ""  # empty = use provider default_model
  temperature: 0.3
  max_tokens: 5000

# Fallback chain: tried in order if primary fails
llm_fallback:
  - kimi
  - openai
  - moonshot 

# Pipeline Configuration
# The pipeline runs in 3 stages:
# 1. Local Filter (MANDATORY) - embedding-based filtering using song_db
# 2. LLM Scoring (OPTIONAL) - re-score papers with LLM API
# 3. Summary Generation (OPTIONAL) - generate summaries or use abstracts

# Stage 1: Local Filter (MANDATORY - always runs first)
local_filter:
  interest_model: "song_db/artifacts/interest_model.json"
  threshold: 0.5  # 0-1 scale (0.5 = 5.0/10) - papers scoring below this are filtered out
  weights:
    w_topic: 0.60
    w_global: 0.30
    w_category: 0.10

# Stage 2 (no-LLM path): Topic-Embedding Scorer
# Maps cosine similarity between paper and topic embeddings to 0-10 scores
# Primary topics map to higher scores (>=8 for strong match)
# Secondary topics map to moderate scores (<=8 for strong match)
topic_scorer:
  primary_breakpoints:
    0.20: 0.0
    0.35: 3.0
    0.45: 5.0
    0.55: 8.0
    0.70: 10.0
  secondary_breakpoints:
    0.20: 0.0
    0.30: 2.0
    0.40: 4.0
    0.50: 6.0
    0.65: 8.0
  match_threshold: 0.50   # cosine sim above this counts as a topic match
  multi_match_bonus: 0.10  # bonus per extra primary topic match (capped at +1.0)
  negative_penalty: 3.0   # penalty multiplier when best negative sim > best primary sim

# Stage 2: LLM Scoring (OPTIONAL - default OFF to save tokens)
# Enable with --use-llm-scoring flag
llm_scoring:
  enabled: false  # Default: disabled (override with --use-llm-scoring)
  keep_tiers:  # Papers in these tiers proceed to summary generation
    - most_relevant
    - somewhat_relevant
  # Tier thresholds (0-10 scale) - used when LLM scoring is enabled
  tier_thresholds:
    most_relevant: 8.0
    somewhat_relevant: 5.0
    could_be_interesting: 3.0

# Stage 3: Summary Generation (OPTIONAL - default ON)
# Disable with --no-summary flag
summary:
  enabled: true  # Default: enabled (override with --no-summary)
  fallback_to_abstract: true  # If LLM API fails, output abstract instead

# Output paths
output:
  digest_dir: "arxiv_digest"
  archive_subdir: "archive"
  obsidian_vault: null  # Optional: path to Obsidian vault

# API settings
api:
  arxiv_delay_seconds: 3.0  # Minimum 3 seconds required by arXiv API terms of use
  arxiv_max_results_per_category: 100
  llm_retry_attempts: 3
  llm_retry_delay_seconds: 5.0
