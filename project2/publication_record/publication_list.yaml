- title: 'Ultra-diffuse galaxies in the perseus cluster: comparing galaxy properties
    with globular cluster system richness'
  year: 2022
  journal: Monthly Notices of the Royal Astronomical Society
  doi: 10.1093/mnras/stab3297
  arxiv_id: '2111.06007'
  abstract: It is clear that within the class of ultra-diffuse galaxies (UDGs), there
    is an extreme range in the richness of their associated globular cluster (GC)
    systems. Here, we report the structural properties of five UDGs in the Perseus
    cluster based on deep Subaru/Hyper Suprime-Cam imaging. Three appear GC-poor and
    two appear GC-rich. One of our sample, PUDG_R24, appears to be undergoing quenching
    and is expected to fade into the UDG regime within the next ~0.5 Gyr. We target
    this sample with Keck Cosmic Web Imager (KCWI) spectroscopy to investigate differences
    in their dark matter haloes, as expected from their differing GC content. Our
    spectroscopy measures both recessional velocities, confirming Perseus cluster
    membership, and stellar velocity dispersions, to measure dynamical masses within
    their half-light radius. We supplement our data with that from the literature
    to examine trends in galaxy parameters with GC system richness. We do not find
    the correlation between GC numbers and UDG phase space positioning expected if
    GC-rich UDGs environmentally quench at high redshift. We do find GC-rich UDGs
    to have higher velocity dispersions than GC-poor UDGs on average, resulting in
    greater dynamical mass within the half-light radius. This agrees with the first
    order expectation that GC-rich UDGs have higher halo masses than GC-poor UDGs.
