- title: 'Reaching for the Edge I: probing the outskirts of massive galaxies with
    HSC, DECaLS, SDSS, and Dragonfly'
  year: 2022
  journal: Monthly Notices of the Royal Astronomical Society
  doi: 10.1093/mnras/stac2121
  arxiv_id: ''
  abstract: 'The outer light (stellar haloes) of massive galaxies has recently emerged
    as a possible low scatter tracer of dark matter halo mass. To test the robustness
    of outer light measurements across different data sets, we compare the 1D azimuthally
    averaged surface brightness profiles of massive galaxies using four independent
    data sets: the Hyper Suprime-Cam survey (HSC), the Dark Energy Camera Legacy Survey
    (DECaLS), the Sloan Digital Sky Survey (SDSS), and the Dragonfly Wide Field Survey
    (Dragonfly). We test the sky subtraction and proposed corrections for HSC and
    DECaLS. For galaxies at z &lt; 0.05, Dragonfly has the best control of systematics,
    reaching surface brightness levels of μ<SUB>r</SUB> ≈ 30 mag arcsec<SUP>-2</SUP>.
    At 0.19 &lt; z &lt; 0.50, HSC can reliably recover individual surface brightness
    profiles to μ<SUB>r</SUB> ≈ 28.5 mag arcsec<SUP>-2</SUP> (R = 100-150 kpc in semimajor
    axis). In a statistical sense, DECaLS agrees with HSC to R &gt; 200 kpc. DECaLS
    and HSC measurements of the stellar mass contained within 100 kpc agree within
    0.05 dex. Finally, we use weak lensing to show that measurements of outer light
    with DECaLS at 0.19 &lt; z &lt; 0.50 show a similar promise as HSC as a low scatter
    proxy of halo mass. The tests and results from this paper represent an important
    step forward for accurate measurements of the outer light of massive galaxies
    and demonstrate that outer light measurements from DECam imaging will be a promising
    method for finding galaxy clusters.'
