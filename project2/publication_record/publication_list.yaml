- title: Relationship between 2D and 3D galaxy stellar mass and correlations with
    halo mass
  year: 2025
  journal: Journal of Cosmology and Astroparticle Physics
  doi: 10.1088/1475-7516/2025/10/014
  arxiv_id: ''
  abstract: Recent studies suggest that the stars in the outer regions of massive
    galaxies trace halo mass better than the inner regions and that an annular stellar
    mass provides a low scatter method of selecting galaxy clusters. However, we can
    only observe galaxies as projected two-dimensional objects on the sky. In this
    paper, we use a sample of simulated galaxies with stellar mass M* &gt; 10<SUP>11.2</SUP>
    M <SUB>⊙</SUB> and z = 0.4 from TNG300 of the IllustrisTNG project to study how
    well galaxy stellar mass profiles in three dimensions correlate with halo mass,
    and what effects arise when observationally projecting stellar profiles into two
    dimensions. We compare 2D and 3D outer stellar mass selections and find that they
    have similar performance as halo mass proxies and that, surprisingly, a 2D selection
    sometimes has marginally better performance with a 0.2 dex scatter of halo mass
    at given stellar mass in the best case. We also investigate whether the weak lensing
    profiles around galaxies selected by 2D outer stellar mass suffer from projection
    effects. We find that the lensing profiles of samples selected by 2D and 3D definitions
    are nearly identical, suggesting that the 2D selection does not create a bias.
    These findings underscore the promise of using outer stellar mass as a tool for
    identifying galaxy clusters.
