- title: Gravitational Wave Astronomy With TianQin
  year: 2024
  journal: arXiv e-prints
  doi: 10.48550/arXiv.2409.19665
  arxiv_id: '2409.19665'
  abstract: The opening of the gravitational wave window has significantly enhanced
    our capacity to explore the Universe's most extreme and dynamic sector. In the
    mHz frequency range, a diverse range of compact objects, from the most massive
    black holes at the farthest reaches of the Universe to the lightest white dwarfs
    in our cosmic backyard, generate a complex and dynamic symphony of gravitational
    wave signals. Once recorded by gravitational wave detectors, these unique fingerprints
    have the potential to decipher the birth and growth of cosmic structures over
    a wide range of scales, from stellar binaries and stellar clusters to galaxies
    and large-scale structures. The TianQin space-borne gravitational wave mission
    is scheduled for launch in the 2030s, with an operational lifespan of five years.
    It will facilitate pivotal insights into the history of our Universe. This document
    presents a concise overview of the detectable sources of TianQin, outlining their
    characteristics, the challenges they present, and the expected impact of the TianQin
    observatory on our understanding of them.
