- title: A Search for Wandering Black Holes in the Milky Way with Gaia and DECaLS
  year: 2021
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ac0896
  arxiv_id: '2105.04581'
  abstract: We present a search for "hypercompact" star clusters in the Milky Way
    using a combination of Gaia and the Dark Energy Camera Legacy Survey (DECaLS).
    Such putative clusters, with sizes of ~1 pc and containing 500-5000 stars, are
    expected to remain bound to intermediate-mass black holes (M<SUB>BH</SUB> ≈ 10<SUP>3</SUP>-10<SUP>5</SUP>
    M<SUB>⊙</SUB>) that may be accreted into the Milky Way halo within dwarf satellites.
    Using the semianalytic model SatGen, we find an expected ~100 wandering intermediate-mass
    black holes if every infalling satellite hosts a black hole. We do not find any
    such clusters in our search. Our upper limits rule out 100% occupancy but do not
    put stringent constraints on the occupation fraction. Of course, we need stronger
    constraints on the properties of the putative star clusters, including their assumed
    sizes and the fraction of stars that would be compact remnants.
