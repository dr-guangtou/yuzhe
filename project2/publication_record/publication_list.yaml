- title: Lensing without borders – I. A blind comparison of the amplitude of galaxy–galaxy
    lensing between independent imaging surveys
  year: 2022
  journal: Monthly Notices of the Royal Astronomical Society
  doi: 10.1093/mnras/stab3586
  arxiv_id: ''
  abstract: Lensing without borders is a cross-survey collaboration created to assess
    the consistency of galaxy-galaxy lensing signals (ΔΣ) across different data sets
    and to carry out end-to-end tests of systematic errors. We perform a blind comparison
    of the amplitude of ΔΣ using lens samples from BOSS and six independent lensing
    surveys. We find good agreement between empirically estimated and reported systematic
    errors which agree to better than 2.3σ in four lens bins and three radial ranges.
    For lenses with z<SUB>L</SUB> &gt; 0.43 and considering statistical errors, we
    detect a 3-4σ correlation between lensing amplitude and survey depth. This correlation
    could arise from the increasing impact at higher redshift of unrecognized galaxy
    blends on shear calibration and imperfections in photometric redshift calibration.
    At z<SUB>L</SUB> &gt; 0.54, amplitudes may additionally correlate with foreground
    stellar density. The amplitude of these trends is within survey-defined systematic
    error budgets that are designed to include known shear and redshift calibration
    uncertainty. Using a fully empirical and conservative method, we do not find evidence
    for large unknown systematics. Systematic errors greater than 15 per cent (25
    per cent) ruled out in three lens bins at 68 per cent (95 per cent) confidence
    at z &lt; 0.54. Differences with respect to predictions based on clustering are
    observed to be at the 20-30 per cent level. Our results therefore suggest that
    lensing systematics alone are unlikely to fully explain the 'lensing is low' effect
    at z &lt; 0.54. This analysis demonstrates the power of cross-survey comparisons
    and provides a promising path for identifying and reducing systematics in future
    lensing analyses.
