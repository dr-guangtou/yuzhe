- title: Improving galaxy cluster selection with the outskirt stellar mass of galaxies
  year: 2025
  journal: Physical Review D
  doi: 10.1103/1j5f-cmkg
  arxiv_id: ''
  abstract: The number density and redshift evolution of optically selected galaxy
    clusters offer an independent measurement of the amplitude of matter fluctuations,
    <inline-formula><mml:math><mml:mrow><mml:msub><mml:mrow><mml:mi>S</mml:mi></mml:mrow><mml:mrow><mml:mn>8</mml:mn></mml:mrow></mml:msub></mml:mrow></mml:math></inline-formula>.
    However, recent results have shown that clusters chosen by the redMaPPer algorithm
    show richness-dependent biases that affect the weak lensing signals and number
    densities of clusters, increasing uncertainty in the cluster mass calibration
    and reducing their constraining power. In this work, we evaluate an alternative
    cluster proxy, outskirt stellar mass, <inline-formula><mml:math><mml:msub><mml:mi>M</mml:mi><mml:mi>out</mml:mi></mml:msub></mml:math></inline-formula>,
    defined as the total stellar mass within a [50, 100] kpc envelope centered on
    a massive galaxy. This proxy exhibits scatter comparable to redMaPPer richness,
    <inline-formula><mml:math><mml:mi>λ</mml:mi></mml:math></inline-formula>, but
    is less likely to be subject to projection effects. We compare the Dark Energy
    Survey Year 3 redMaPPer cluster catalog with a <inline-formula><mml:math><mml:msub><mml:mi>M</mml:mi><mml:mi>out</mml:mi></mml:msub></mml:math></inline-formula>
    selected cluster sample from the Hyper-Suprime Camera survey. We use weak lensing
    measurements to quantify and compare the scatter of <inline-formula><mml:math><mml:msub><mml:mi>M</mml:mi><mml:mi>out</mml:mi></mml:msub></mml:math></inline-formula>
    and <inline-formula><mml:math><mml:mi>λ</mml:mi></mml:math></inline-formula> with
    halo mass. Our results show <inline-formula><mml:math><mml:msub><mml:mi>M</mml:mi><mml:mi>out</mml:mi></mml:msub></mml:math></inline-formula>
    has a scatter consistent with <inline-formula><mml:math><mml:mi>λ</mml:mi></mml:math></inline-formula>,
    with a similar halo mass dependence, and that both proxies contain unique information
    about the underlying halo mass. We find <inline-formula><mml:math><mml:mi>λ</mml:mi></mml:math></inline-formula>-selected
    samples introduce features into the measured <inline-formula><mml:math><mml:mi>Δ</mml:mi><mml:mi>Σ</mml:mi></mml:math></inline-formula>
    signal that are not well fit by a log-normal scatter only model, absent in <inline-formula><mml:math><mml:msub><mml:mi>M</mml:mi><mml:mi>out</mml:mi></mml:msub></mml:math></inline-formula>
    selected samples. Our findings suggest that <inline-formula><mml:math><mml:msub><mml:mi>M</mml:mi><mml:mi>out</mml:mi></mml:msub></mml:math></inline-formula>
    offers an alternative for cluster selection with more easily calibrated selection
    biases, at least at the generally lower richnesses probed here. Combining both
    proxies may yield a mass proxy with a lower scatter and more tractable selection
    biases, enabling the use of lower mass clusters in cosmology. Finally, we find
    the scatter and slope in the <inline-formula><mml:math><mml:mi>λ</mml:mi><mml:mo>-</mml:mo><mml:msub><mml:mi>M</mml:mi><mml:mi>out</mml:mi></mml:msub></mml:math></inline-formula>
    scaling relation to be <inline-formula><mml:math><mml:mn>0.49</mml:mn><mml:mo>±</mml:mo><mml:mn>0.02</mml:mn></mml:math></inline-formula>
    and <inline-formula><mml:math><mml:mn>0.38</mml:mn><mml:mo>±</mml:mo><mml:mn>0.09</mml:mn></mml:math></inline-formula>.
