- title: The Nature of Low-surface-brightness Galaxies in the Hyper Suprime-Cam Survey
  year: 2022
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ac7238
  arxiv_id: ''
  abstract: We present the statistical redshift distribution of a large sample of
    low-surface-brightness (LSB) galaxies identified in the first 200 deg<SUP>2</SUP>
    of the Hyper Suprime-Cam Strategic Survey Program. Through cross-correlation with
    the NASA-SDSS Atlas, we find that the majority of objects lie within z &lt; 0.15
    or ~500 Mpc, yielding a mass range of M <SUB>*</SUB> ≈ 10<SUP>7</SUP>-10<SUP>9</SUP>
    M <SUB>⊙</SUB> and a size range of r <SUB>eff,g </SUB> ≈ 1-8 kpc. We find a peak
    in the distance distribution within 100 Mpc, corresponding mostly to ~10<SUP>7</SUP>
    M <SUB>⊙</SUB> galaxies that fall on the known mass-size relation. There is also
    a tail in the redshift distribution out to z ≈ 0.15, comprising more massive (M
    <SUB>*</SUB> = 10<SUP>8</SUP> - 10<SUP>9</SUP> M <SUB>⊙</SUB>) galaxies at the
    larger end of our size range. We see tentative evidence that at the higher-mass
    end (M <SUB>*</SUB> &gt; 10<SUP>8</SUP> M <SUB>⊙</SUB>), the LSB galaxies do not
    form a smooth extension of the mass-size relation of higher-surface-brightness
    galaxies, perhaps suggesting that the LSB galaxy population is distinct in its
    formation path.
