10.3847/1538-4365/ae1f10: GalaxySD——首个基于Galaxy Zoo 2标注数据训练的条件扩散模型——可生成具有照片级真实感且形态高度精确的星系图像，使稀有尘埃带早型星系的探测数量翻倍（从352例增至872例），并使分类的完备率与纯度最高提升30%，有力证明了生成式人工智能可在标注数据极度匮乏的领域可靠拓展可观测前沿。
10.3847/1538-4357/ae20f5: 我们报告了“Zangetsu”——一个独特孤立、宁静且极度细长的超弥散星系（UDG）的发现。该星系挑战了传统的形成模型，可能是首个被证实的回溅型超弥散星系，为探索低面亮度宇宙的动力学与演化开辟了新窗口。
10.3847/1538-4357/ae003e: 默里安巡天（Merian Survey）的首批数据发布，提供了覆盖750平方度天区的前所未有的中波段成像数据：一方面，通过探测Hα与[O
  III]发射线超出，实现了对红移z ∼ 0.06–0.10范围内恒星形成矮星系的高精度、谱线驱动型测光红移测量；另一方面，首次构建出延伸至矮星系晕体引力束缚半径（virial
  radii）的高保真弱引力透镜质量图，从而在直接探测量暗物质结构的同时，有效剥离重子物理效应的影响。
10.1088/1475-7516/2025/10/014: 我们发现，天文学家实际观测到的二维投影外围恒星质量不仅是一种实用的代理参量，更是晕质量的一种更优（或至少同等有效）的示踪量；其与晕质量之间的弥散可低至0.2
  dex，并能产生无偏的弱引力透镜信号——从而在无需难以获取的三维数据的前提下，实现稳健且观测上切实可行的星系团选源。
10.3847/1538-4357/adf43a: 我们发现了“氧星云”（Oxyster）——一个围绕红移z ∼ 1处星暴星系、尺度达30 kpc的巨大低电离氧发射星云。该发现挑战了传统理论模型，表明仅靠剧烈的恒星形成活动（其中活动星系核AGN的贡献极小），即可驱动此前被认为必须依赖高光度AGN才能产生的、尺度达星系周介质（CGM）量级的巨电离结构。这是首例不依赖AGN的类“汉妮天体”（Hanny’s
  Voorwerp–like）星云，证实星暴过程在宇宙演化历程中主导着正常星系的电离辐射输出及CGM物理过程。
10.3847/1538-4357/adeca0: 我们发现，大质量星系在50–100 kpc外围区域的恒星质量，是一种独特而强效的暗物质晕质量示踪体；该关系已通过数值模拟验证，其性能优于总恒星质量，甚至优于完整的外源（并合吸积）恒星质量，从而揭示出一种稳健且可观测的晕并合历史探针。
10.1103/1j5f-cmkg: 我们提出外围恒星质量（$M_\mathrm{out}$）作为一种新颖的、抗投影效应的星系团示踪量：其散射程度与redMaPPer丰富度相当，同时消除了弱引力透镜信号中未建模的系统特征，从而实现更稳健、更低散射的星系团质量定标，并释放低质量星系团在宇宙学约束中的潜力。
10.3847/1538-4357/ad6861: 本研究揭示，在低质量星系中，高比恒星形成率促使Hα辐射呈现出持续致密且不均匀的特征——这表明动力学不稳定性将分子气体聚集于星系中心区域；该成果首次利用梅里安巡天（Merian
  Survey）中波段成像，将这一关键的形态—恒星形成关系拓展至此前尚未探索的质量区间。
10.48550/arXiv.2410.01884: 默里安望远镜（Merian）开创性的中波段成像——结合HSC-SSP宽波段数据——首次实现了对红移 *z*~0.06–0.10
  区间内恒星形成矮星系的高精度、大视场测光红移选源，其核心在于直接探测Hα与[O III]发射线；由此得以在晕体半径尺度上开展前所未有的弱引力透镜测量，从而精确刻画其暗物质晕结构。这一突破性进展开辟了一条全新的观测途径，使人们得以在低质量系统中有效分离重子物理效应与暗物质贡献，并跨越宇宙时间尺度，深入探查最暗弱、金属丰度最低的星系。
10.48550/arXiv.2409.19665: “天琴计划”将于2030年代率先开展空间毫赫兹频段高精度引力波天文学研究， uniquely实现对宇宙各类天体系统的同步探测与表征——从邻近的致密白矮星双星，到红移超过
  *z* = 2 的超大质量黑洞并合事件，从而深刻革新我们对宇宙时标内结构形成过程的认知。
10.48550/arXiv.2409.14807: 我们推出Mephisto——首个基于大语言模型（LLM）的多智能体系统，可自主、近似人类水平地解读多波段星系观测数据，已成功解码詹姆斯·韦布空间望远镜（JWST）数据，包括难以捉摸的“微红点”（Little
  Red Dot）星系，标志着具备智能体能力的端到端天文研究时代的开启。
10.1093/mnras/stae1374: BCG（最亮团星系）违背了典型的星系标度关系，其特有的陡峭的尺度–质量关系（$r_e \propto M_*^{0.73\text{–}1.00}$）在宇宙时标上保持稳定；而其显著的尺度演化——从
  $z \sim 1.2$ 到 $z \sim 0.2$ 期间增大达2.5倍——表明并合过程以小质量并合为主导机制，驱动BCG增长，且该机制与宿主暗晕质量无关。
10.48550/arXiv.2406.01391: 我们构建了首个大规模天文知识图谱——涵盖31年时间跨度、298,000篇论文——以客观量化数值模拟与机器学习如何重塑天文发现。结果表明：尽管人工智能已深度融入天文学，该领域当前却面临一个关键瓶颈：在人工智能与天文学交叉界面处，显著缺乏*全新、融合性概念*，这正昭示着亟需培育突破性创新的方向。
10.1093/mnras/stae882: DESI巡天发现的超大质量星系所提供的Ωₘ–σ₈宇宙学约束，其精度可与传统星系团计数方法相媲美；但其探测范围可延伸至更低质量的暗晕（低至约10¹³
  M⊙ h⁻¹），且系统误差显著更小、更稳健，优于光学星系团搜寻方法。该方法依托质量完备样本与投影关联函数wₚ，实现了“无需星系团识别的星系团宇宙学”，开辟了一条高精度探测量子尺度以下宇宙结构增长的新途径。
10.1093/mnras/stae925: 梅里安巡天（Merian survey）首次实现了对矮星系周围弱引力透镜效应的高信噪比测量——在1 Mpc范围内信噪比达≈90；该成果得益于其首创的一套定制中波段滤光片（N540/N708），可为约8.5万个恒星形成矮星系提供高精度测光红移（σ<sub>Δz/(1+z)</sub>
  ≈ 0.01），从而为检验低质量区间的暗物质晕结构与恒星反馈机制开辟了变革性研究路径。
10.3847/1538-4357/ad19c8: 我们发布了针对238,516个DESI BGS星系的首个严格基于概率方法构建的恒星质量函数——完整传播了所有不确定性，校正了选择效应，并解析了红移演化以及恒星形成/宁静子总体的差异，从而建立了一套全新的统计学“金标准”框架，为整个DESI巡天中低红移星系的人口统计学研究提供了前所未有的精度。
10.3847/1538-3881/ad0be4: POPSED 通过宽带测光数据，直接推断出多达 10⁵ 个星系的物理属性（如红移和恒星质量）的完整联合分布，单次
  GPU 运算耗时不足一小时，相比传统谱能量分布（SED）建模方法提速达 10⁵–10⁶ 倍，同时稳健复现星系形成主序等关键天体物理关系。这一突破性进展为下一代宇宙学巡天提供了可扩展、统计上严格可靠的星系群体级推断能力。
10.48550/arXiv.2310.20125: Zephyr 首次开创了一种可解释的、基于标准化流（normalizing flow）的框架，能够无缝整合异构的测光红移训练数据，在实现稳健且具备不确定性感知的推断的同时，
  uniquely 量化每个数据集对弱引力透镜系统误差控制的独特贡献。
10.3847/1538-4357/ace829: 我们发现，“超蓬松”星系（即质量-尺寸关系上方1.5σ处的卫星星系）是一类在银河系类似宿主星系中稳健存在、且具有明确物理动因的星系群体；平均每颗宿主星系拥有约0.3个此类超蓬松星系（UPG），从而为探索超出传统基于面亮度定义的超弥散星系（UDG）之外的星系形成物理机制，提供了一种全新视角。
10.3847/1538-4357/ace4c5: 本研究揭示，围绕银河系类似体的“超蓬松星系”（即质量-尺寸关系中的异常体）与正常尺寸的卫星星系具有相同的熄灭率，从而证明极端尺寸本身并非环境致熄灭的驱动因素；真正起决定性作用的是宿主星系的颜色和距离，而传统的超漫延矮星系（UDG）定义则人为地将尺寸与宁静态混为一谈。
10.3847/1538-4357/acd92f: 我们构建了首个宇宙学模拟框架——该框架基于111组高保真N体模拟进行训练，可同时、精确地建模红移空间中的星系成团性与星系-星系引力透镜效应，涵盖包括中微子质量与动力学暗能量在内的八个宇宙学参数；当结合CMB先验信息时，其对结构增长率的测量精度可达2%，这标志着当前星系巡天开展多探针联合宇宙学研究取得突破性进展。
10.1093/mnras/stac3023: IllustrisTNG 模拟结果与 MaNGA 观测数据——特别是在恒星质量、金属丰度和恒星年龄径向分布方面——展现出卓越的一致性，为迄今最强有力的观测证据，表明大质量早型星系主要通过并合驱动的演化形成：其中主并合事件使恒星成分趋于均一，并抹除其前身星系的特征印记。
10.1093/mnras/stac2938: 这项具有里程碑意义的多巡天联合分析——整合了BOSS、DES-Y3、HSC-Y1和KiDS-1000数据——表明，在低S₈
  = 0.76的“透镜宇宙学”（A = 1）框架下，宇宙剪切与星系成团性测量结果完全一致；该结果成功消解了与普朗克（Planck）卫星长期存在的张力，同时在严格建模重子反馈效应与样本选择等系统误差的前提下，进一步证实了现代弱引力透镜探针的稳健性。
10.3847/1538-4357/ac9964: 超弥散星系（UDG）并非“失败的星系”或剧烈反馈作用的遗迹；相反，它们以正常方式形成恒星，但其恒星形成效率在所有尺度上均显著偏低，这挑战了依赖于爆发式恒星形成或恒星膨胀机制来解释其弥散特性的理论模型。
10.1093/mnras/stac2121: 本研究确立了DECaLS作为测量大质量星系外围恒星光度的可靠、宽视场替代方案，其围成恒星质量与HSC结果的偏差小于0.05
  dex，并通过弱引力透镜效应展现出与晕质量高度一致、弥散度极低的相关性，从而充分释放DECaLS全天区覆盖范围内的星系团搜寻潜力。
10.1093/mnras/stac1680: 我们发现，大质量星系外围包层（50–100 kpc）中的恒星质量是一种异常洁净、弥散度极低的晕质量示踪体——其精度可媲美当前最先进的基于丰富度的星系团搜寻方法，同时规避了后者固有的投影效应与中心偏移偏差，从而为星系团宇宙学研究提供了一种变革性的、抗偏差探针。
10.3847/1538-4357/ac6d66: MaNGA 的积分场巡天揭示，附近最亮团星系（BCG）中有 11% 拥有多个恒星核——这是正在进行的星系并合“同类相食”过程的直接观测证据。该结果与
  IllustrisTNG 数值模拟高度一致，最终在近 45 亿年的时间尺度上，使观测得到的 BCG 质量增长速率与理论预言达成统一。
10.3847/1538-4357/ac7238: 本研究揭示，低面亮度星系并非普通星系的微弱延展，而是一个独特的星系群体——尤其在恒星质量高于10⁸ M⊙时——其显著偏离标准的质量-尺寸关系，表明其形成路径具有特殊性，从而厘清了星系演化理论中长期存在的模糊认识。
10.3847/1538-4357/ac6c88: FIRE-2 数值模拟揭示，矮星系可通过盘星族向外迁移（即原位形成）构建延展、近球对称且年老的恒星晕——而非依赖并合过程。这一突破性发现解决了长期存在的矛盾：观测上矮星系普遍存在恒星晕，但其并合历史却不足以支撑此类结构的形成。该发现确立了恒星形态学作为检验星系形成物理（尤其是恒星形成反馈机制）的一种强有力且易于开展观测验证的诊断工具。
10.1093/mnras/stab3586: 这项针对星系-星系引力透镜效应振幅的盲态、跨巡天比对研究——涵盖六项独立成像巡天项目及百余位作者——未发现显著未知系统误差的证据（68%置信水平下小于15%），从而稳健地排除了透镜效应系统误差作为z
  < 0.54红移范围内“透镜信号偏低”张力唯一成因的可能性，并进一步证实：协作式、基于实证的验证是实现高精度宇宙剪切测量科学目标的一条有力途径。
10.1093/mnras/stab3297: 本研究揭示，英仙座星系团中球状星团（GC）丰富的超弥散星系（UDG）具有显著更高的恒星速度弥散度，因而其半光半径内的动力学质量也明显更大；这为球状星团丰度可示踪超弥散星系间暗晕质量差异这一观点提供了直接的观测证据。
10.3847/1538-4357/ac1f21: 这项具有里程碑意义的HSC-SSP研究首次以空前的统计效力与成像保真度揭示：星系尺寸–质量关系并非单一幂律，而是在一个具有明确物理意义的拐点质量处发生转折——该拐点对应于原位恒星形成主导向干并合主导转变的临界质量；尤为关键的是，该研究证实低质量宁静星系仍保留其恒星形成前身星系所具有的较大尺寸，从而为近期发生的、温和的熄灭过程（未引发显著结构扰动）提供了直接的结构证据。
10.1093/mnras/stab2363: BCG在红移范围0.3 < z < 1.0内具有统计学上的特殊性——其质量显著偏离其所在星系团星系质量分布的随机抽样结果，这表明其独特的形成路径已持续逾70亿年；尤为关键的是，仅当BCG在空间位置上偏离星系团中心时，这种特殊性才消失，从而直接揭示了其异常性质与动力学弛豫过程及中心主导地位之间的物理关联。
10.1093/mnras/stab2589: 我们开发了首个可扩展的、基于生成对抗网络（GAN）的无监督异常检测方法，用于百万星系巡天数据，成功识别出约13,000个具有明确物理意义的异常源，涵盖稀有并合星系、潮汐结构及极端恒星形成系统等；后续光谱观测证实，其中一例异常源为一个金属丰度极低的矮星系，其内部存在一个异常蓝、且金属丰度相对更高的H
  II区，有力证明了该方法在发现真正新颖天体物理现象方面的强大能力。
10.3847/1538-4357/ac15f0: 我们发现，低面亮度星系本质上均为扁椭球体——无论其颜色或所处环境如何——且其观测到的厚度特征强烈支持恒星形成向外迁移的形成机制，而非其他可能的形成途径；这为低面亮度星系的起源提供了首个坚实、基于观测的约束。
10.3847/1538-4357/ac0896: 这是首次在银河系内搜寻游荡型中等质量黑洞的研究——利用盖亚（Gaia）卫星的高精度天体测量数据与暗能量巡天（DECaLS）的深度成像，搜寻其特征性超致密星团。该研究迄今给出了最强的观测限制，完全排除了此类黑洞100%占据的可能性，为下一代巡天项目最终探测到这些神秘的宇宙游牧者铺平了道路。
