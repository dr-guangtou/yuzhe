- title: 'Hyper Suprime-Cam Subaru Strategic Program: A Mass-dependent Slope of the
    Galaxy Size−Mass Relation at z < 1'
  year: 2021
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ac1f21
  arxiv_id: ''
  abstract: We present the galaxy size-mass (R<SUB>e</SUB>-M<SUB>*</SUB>) distributions
    using a stellar mass complete sample of ~1.5 million galaxies, covering ~100 deg<SUP>2</SUP>,
    with $\mathrm{log}({M}_{* }/{M}_{\odot })\gt 10.2\,(9.2)$ over the redshift range
    0.2 &lt; z &lt; 1.0 (z &lt; 0.6) from the second public data release of the Hyper
    Suprime-Cam Subaru Strategic Program. We confirm that, at fixed redshift and stellar
    mass over the range of $\mathrm{log}({M}_{* }/{M}_{\odot })\lt 11$ , star-forming
    galaxies are on average larger than quiescent galaxies. The large sample of galaxies
    with accurate size measurements, thanks to the excellent imaging quality, also
    enables us to demonstrate that the R<SUB>e</SUB>-M<SUB>*</SUB> relations of both
    populations have a form of a broken power law, with a clear change of slopes at
    a pivot stellar mass M<SUB>p</SUB>. For quiescent galaxies, below an (evolving)
    pivot mass of $\mathrm{log}({M}_{p}/{M}_{\odot })=10.2\mbox{--}10.6$ , the relation
    follows ${R}_{e}\propto {M}_{\ast }^{0.1}$ ; above M<SUB>p</SUB> the relation
    is steeper and follows ${R}_{e}\propto {M}_{* }^{0.6\mbox{--}0.7}$ . For star-forming
    galaxies, below $\mathrm{log}({M}_{p}/{M}_{\odot })\sim 10.7$ the relation follows
    ${R}_{e}\propto {M}_{* }^{0.2}$ ; above M<SUB>p</SUB> the relation evolves with
    redshift and follows ${R}_{e}\propto {M}_{* }^{0.3\mbox{--}0.6}$ . The shallow
    power-law slope for quiescent galaxies below M<SUB>p</SUB> indicates that large
    low-mass quiescent galaxies have sizes similar to those of their counterpart star-forming
    galaxies. We take this as evidence that large low-mass quiescent galaxies have
    been recently quenched (presumably through environment-specific processes) without
    significant structural transformation. Interestingly, the pivot stellar mass of
    the R<SUB>e</SUB>-M<SUB>*</SUB> relations for both populations also coincides
    with the mass at which half of the galaxy population is quiescent, implying that
    the pivot mass represents the transition of galaxy growth from being dominated
    by in situ star formation to being dominated by (dry) mergers.
