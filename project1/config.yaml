# Daily arXiv Summary Configuration
# Last updated: 2026-02-05

# arXiv categories to monitor
category:
  primary:
    - astro-ph.GA
    - astro-ph.CO
  secondary:
    - astro-ph.IM

# Scientific topics of interest (order does not matter)
topics:
  primary:
    - "Extragalactic: Galaxy-dark matter halo connection; halo mass and properties (concentration, assembly history, halo age, halo shape, assembly bias, and splashback radius); satellite galaxies; stellar mass–halo mass relation"
    - "Extragalactic: Galaxy structure and morphology; stellar halos; low surface brightness features; galaxy interactions and mergers"
    - "Extragalactic: The star formation history, stellar mass growth/assembly history, chemical enrichment history, and quenching process of massive quiescent early-type galaxies across cosmic time"
    - "Extragalactic: using galaxy-galaxy weak lensing to constrain the galaxy–dark matter halo connection, dark matter halo properties, and cosmological parameters"
    - "Extragalactic: the dynamics and kinematics of stars (rotation velocity and velocity dispersion) in massive quiescent early-type galaxies"
    - "Extragalactic: galaxy clusters as cosmological probes and laboratories for galaxy evolution, including cluster mass and properties, galaxy populations, intra-cluster light (ICL), and intra-cluster medium (ICM)"
    - "Extragalactic: high-redshift massive or quiescent galaxies and their low redshift descendent"
    - "Extragalactic: how does supernova feedback and AGN feedback regulate star formation and galaxy evolution in massive and dwarf galaxies?"
    - "Extragalactic: low surface brightness universe, including stellar halos, tidal features, intra-cluster light, and low surface brightness galaxies, including the ultra-diffuse galaxies"
    - "Extragalactic: Galaxy cluster detection and characterization using multi-survey photometric and spectroscopic data, including optical, X-ray, and Sunyaev-Zel'dovich (SZ) effect observations"
    - "Extragalactic: 1-D surface brightness profile, 2-D image modeling and structural decomposition of galaxies, including bulge-disc-bar decomposition and stellar mass distribution modeling"
    - "Extragalactic: high-redshift galaxies and their formation, especially on the population of submillimeter galaxies (SMG), Lyman-break galaxies (LBG), Lyman-alpha emitters (LAE), and Little Red Dots (LRD)"
    - "Cosmology: cosmological constraints from galaxy clusters and groups."
    - "Stellar population synthesis: initial mass function (IMF), stellar evolution models (isochrones), stellar spectral libraries, AGB and TP-AGB phases, and their applications to galaxy evolution studies"
    - "Multi-object spectroscopic survey: target selection, survey strategy design, fiber assignment, mock catalog generation, and scientific analysis of survey data"
  secondary:
    - "Extragalactic: the galaxy–dark matter halo connection and halo mass and properties (concentration, assembly history, halo age, halo shape) for low-mass dwarf galaxies"
    - "Extragalactic: the circumgalactic medium (CGM) and intergalactic medium (IGM) and their connection to galaxy formation and evolution"
    - "Extragalactic: Super-massive black hole (SMBH) and active Galactic Nuclei (AGN) feedback and its impact on galaxy evolution, including the co-evolution of SMBHs and their host galaxies"
    - "Extragalactic: diagnostics of star formation rate and gas-phase metallicity (chemical abundance) in galaxies across cosmic time"
    - "Extragalactic: globular cluster population, ultra-compact dwarfs, and nuclear star clusters in galaxy clusters, massive galaxies, and dwarf galaxies"
    - "Cosmology: halo occupation distribution (HOD) modeling and halo model of galaxy clustering and galaxy-galaxy lensing"
    - "Cosmology: observational constraint of primordial non-Gaussianity using large-scale structure"
    - "Cosmology: baryonic effects on the matter power spectrum and weak lensing cosmology; baryonification of N-body simulations"
    - "Cosmological constraints from weak gravitational lensing, including the cosmic shear, galaxy-galaxy lensing, and 3x2pt analyses"
    - "Instrumentation: multi-object spectrograph, integral field unit (IFU), and other advanced astronomical instrumentation design, development, and data analysis techniques"
    - "Method: photometric redshift estimation and its applications"
    - "Method: spectral energy distribution (SED) and spectra fitting and analysis"
    - "Method: machine learning and artificial intelligence applications in astronomy"
    - "Method: statistical methods and data mining in astronomy"
    - "Stellar: physics related to the AGB and TP-AGB phases of stellar evolution"
  negative:
    - "Exoplanet; protoplanetary disks; planet formation; prestellar cores"
    - "Solar physics; solar corona related physics; solar MHD; solar flares; solar wind"
    - "Star formation and molecular gas clouds in the Milky Way (Galactic)"
    - "Stellar physics (except for AGB and TP-AGB phases); stellar evolution (except for AGB and TP-AGB phases); stellar populations in the Milky Way (Galactic)" 
    - "Compact object: neutron star, pulsar, or stellar mass black hole"
    - "Galactic (Milky Way) structure and dynamics"

