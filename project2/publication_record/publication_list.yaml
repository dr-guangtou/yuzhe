- title: 'The outer stellar mass of massive galaxies: a simple tracer of halo mass
    with scatter comparable to richness and reduced projection effects'
  year: 2022
  journal: Monthly Notices of the Royal Astronomical Society
  doi: 10.1093/mnras/stac1680
  arxiv_id: ''
  abstract: 'Using the weak gravitational lensing data from the Hyper Suprime-Cam
    Subaru Strategic Program (HSC survey), we study the potential of different stellar
    mass estimates in tracing halo mass. We consider galaxies with log<SUB>10</SUB>(M<SUB>⋆</SUB>/M<SUB>⊙</SUB>)
    &gt; 11.5 at 0.2 &lt; z &lt; 0.5 with carefully measured light profiles, and clusters
    from the redMaPPer and CAMIRA richness-based algorithms. We devise a method (the
    ''Top-N test'') to evaluate the scatter in the halo mass-observable relation for
    different tracers, and to inter-compare halo mass proxies in four number density
    bins using stacked galaxy-galaxy lensing profiles. This test reveals three key
    findings. Stellar masses based on CModel photometry and aperture luminosity within
    R &lt;30 kpc are poor proxies of halo mass. In contrast, the stellar mass of the
    outer envelope is an excellent halo mass proxy. The stellar mass within R = [50,
    100] kpc, M<SUB>⋆, [50, 100]</SUB>, has performance comparable to the state-of-the-art
    richness-based cluster finders at log<SUB>10</SUB>M<SUB>vir</SUB> ≳ 14.0 and could
    be a better halo mass tracer at lower halo masses. Finally, using N-body simulations,
    we find that the lensing profiles of massive haloes selected by M<SUB>⋆, [50,
    100]</SUB> are consistent with the expectation for a sample without projection
    or mis-centring effects. Richness-selected clusters, on the other hand, display
    an excess at R ~ 1 Mpc in their lensing profiles, which may suggest a more significant
    impact from selection biases. These results suggest that M<SUB>⋆</SUB>-based tracers
    have distinct advantages in identifying massive haloes, which could open up new
    avenues for cluster cosmology. The codes and data used in this work can be found
    here:'
