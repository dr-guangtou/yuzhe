# Personal Publication Record Configuration
# Last updated: 2026-02-08

# User settings (references user.yaml for full info)
user:
  orcid: "0000-0003-1385-7591"
  year_cutoff: 2021

# Provider registry: reused from project1
providers:
  moonshot:
    api_key_env: "MOONSHOT_API_KEY"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "kimi-latest"

  kimi:
    api_key_env: "KIMI_API_KEY"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "kimi-latest"

  nvidia:
    api_key_env: "NVIDIA_API_KEY"
    base_url: "https://integrate.api.nvidia.com/v1"
    default_model: "moonshotai/kimi-k2.5"

  qwen:
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    default_model: "qwen-plus"

  glm:
    api_key_env: "GLM_API_KEY"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    default_model: "glm-4-flash"

  deepseek:
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    default_model: "deepseek-chat"

  openai:
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-4o-mini"

  gemini:
    api_key_env: "GEMINI_API_KEY"
    default_model: "gemini-2.0-flash"
    client_type: "gemini"

# LLM Configuration
llm:
  provider: "kimi"
  model: ""
  temperature: 0.3
  max_tokens: 2000

# Fallback chain: tried in order if primary fails
llm_fallback:
  - kimi
  - qwen
  - glm
  - openai

# Output paths
output:
  record_dir: "publication_record"
  portfolio_subdir: "portfolio"

# API settings
api:
  orcid_timeout: 30
  ads_api_key_env: "ADS_API_TOKEN"
  ads_timeout: 30
  ads_rate_limit_delay: 1.0
  llm_retry_attempts: 3
  llm_retry_delay_seconds: 5.0
