- title: 'Oxyster: A Circumgalactic Low-ionization Oxygen Nebula next to a Starburst
    Galaxy at z ∼ 1'
  year: 2025
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/adf43a
  arxiv_id: ''
  abstract: Extended emission line nebulae around galaxies or active galactic nuclei
    (AGNs) provide a unique window to investigate the galactic ecosystem through the
    circumgalactic medium (CGM). Using Subaru Hyper Suprime-Cam narrowband imaging
    and spectroscopic follow-up, we serendipitously discover "Oxyster"—a large ionized
    nebula next to an interacting starburst galaxy at z = 0.924. The nebula is traced
    by extended [O II] λλ3726, 3729 (∼30 kpc) and [O III] λ5007 (∼20 kpc) emission
    lines. On the nebula luminosity─size plane, Oxyster surpasses the extended narrow-line
    regions around low-z AGNs, resembling a higher-z analog of "Hanny's Voorwerp."
    However, its uniformly low [O III]/[O II] ratio (O32) sets it apart from typical
    AGN light echoes. For the host galaxy, Hubble Space Telescope and JWST images
    reveal a disturbed red disk galaxy with a single blue spiral "arm." Spectral energy
    distribution fitting suggests the (2─6) × 10<SUP>10</SUP> M<SUB>⊙</SUB> host galaxy
    sits above the star-forming main sequence with an ongoing starburst, especially
    in the "arm," and has &lt;5% luminosity contribution from AGNs, consistent with
    X-ray nondetection and the radio continuum. Standard photoionization and shock
    models struggle to explain simultaneously Oxyster's emission line luminosities,
    low O32 ratio, and the nondetection of the Hβ line. A plausible explanation could
    involve the combination of a recent (&lt;10<SUP>8</SUP> yr) starburst and a low-luminosity
    AGN (L<SUB>bol</SUB> ∼ 1 × 10<SUP>42</SUP> erg s<SUP>−1</SUP>). While Oxyster's
    nature awaits future investigation, its discovery highlights the potential of
    ground-based narrowband imaging to uncover extended emission line nebulae around
    non-AGN systems, opening new avenues for studying the CGM of normal galaxies in
    the early Universe.
