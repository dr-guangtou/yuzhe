# Daily arXiv Summary Configuration
# Last updated: 2026-02-05

# arXiv categories to monitor
category:
  primary:
    - astro-ph.CO
    - astro-ph.GA
    - astro-ph.IM
  secondary:
    - astro-ph.SR

# Scientific topics of interest (order does not matter)
topics:
  primary:
    - "Galaxy formation and evolution in general"
    - "Galaxy-halo connection and its application in cosmology"
    - "Evolution of galaxies in galaxy groups and clusters"
    - "The star formation history and quenching history of galaxies"
    - "Galaxy structure and morphology, including bulges, disks, bars, and stellar halos"
    - "Feedback processes in galaxy formation, including supernova and AGN feedback"
    - "Low surface brightness universe: stellar halos, tidal features, intra-cluster light, and low surface brightness galaxies, including the ultra-diffuse galaxies"
    - "High-redshift galaxies and their formation, especially on the population of submillimeter galaxies (SMG), Lyman-break galaxies (LBG), Lyman-alpha emitters (LAE), and Little Red Dots (LRD)"
    - "Dark matter distribution in galaxies and galaxy clusters"
    - "Data analysis methods and algorithms for extragalactic and cosmological data"
    - "The design and scientific preparation of large astronomical surveys and missions"
    - "Method: galaxy image analysis and modeling"
    - "Method: spectral energy distribution (SED) and spectra fitting and analysis"
    - "Method: machine learning and artificial intelligence applications in astronomy"
    - "Method: statistical methods and data mining in astronomy"
  secondary:
    - "Interactions and mergers of galaxies"
    - "Chemical evolution of galaxies and stellar populations"
    - "The circumgalactic medium and intergalactic medium"
    - "The role of environment in galaxy evolution"
    - "Compact stellar systems: extragalactic globular clusters, ultra-compact dwarfs, and nuclear star clusters"
    - "The nature of dark matter and its impact on galaxy evolution"
    - "Cosmological simulations of galaxy formation and evolution"
    - "Large-scale structure of the universe and galaxy clustering"
    - "Observational constraint of primordial non-Gaussianity using large-scale structure"
    - "The impact of baryonic physics on cosmological observables"
    - "Cosmological constraints from weak gravitational lensing and galaxy-galaxy lensing"
    - "Cosmological constraints using galaxy clusters as probes"
    - "Development of new instruments and technologies for astronomy"
    - "Method: photometric redshift estimation and its applications"
    - "Stellar: physics related to the AGB and TP-AGB phases of stellar evolution"

# Projects to follow (papers mentioning these in title get minimum "Could Be Interesting")
projects:
  - name: "Dark Energy Survey"
    acronym: "DES"
  - name: "Hyper Suprime-Cam Subaru Strategic Program"
    acronym: "HSC-SSP"
  - name: "Vera C. Rubin Observatory Legacy Survey of Space and Time"
    acronym: "LSST"
  - name: "Euclid Mission"
    acronym: "Euclid"
  - name: "Kilo-Degree Survey"
    acronym: "KiDS"
  - name: "Nancy Grace Roman Space Telescope"
    acronym: "Roman"
  - name: "Dark Energy Spectroscopic Instrument"
    acronym: "DESI"
  - name: "4MOST"
    acronym: "4MOST"
  - name: "SDSS-V"
    acronym: "SDSS"
  - name: "eRosita"
    acronym: "eROSITA"
  - name: "Atacama Cosmology Telescope"
    acronym: "ACT"
  - name: "Spec-S5"
    acronym: "S5"
  - name: "Wide-Field Spectroscopic Telescope"
    acronym: "WST"
  - name: "James Webb Space Telescope"
    acronym: "JWST"

# Provider registry: each entry = (api_key_env, base_url, default_model)
# client_type defaults to "openai"; set to "gemini" for Google AI only
# Add/remove providers here - zero code changes needed
providers:
  moonshot:
    api_key_env: "MOONSHOT_API_KEY"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "kimi-latest"

  kimi:
    api_key_env: "KIMI_API_KEY"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "kimi-latest"

  nvidia:
    api_key_env: "NVIDIA_API_KEY"
    base_url: "https://integrate.api.nvidia.com/v1"
    default_model: "moonshotai/kimi-k2.5"

  qwen:
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    default_model: "qwen-plus"

  glm:
    api_key_env: "GLM_API_KEY"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    default_model: "glm-4-flash"

  deepseek:
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    default_model: "deepseek-chat"

  openai:
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-4o-mini"

  gemini:
    api_key_env: "GEMINI_API_KEY"
    default_model: "gemini-2.0-flash"
    client_type: "gemini"

# LLM Configuration
# Primary provider (must exist in providers above)
llm:
  provider: "kimi"
  model: ""  # empty = use provider default_model
  temperature: 0.3
  max_tokens: 2000

# Fallback chain: tried in order if primary fails
llm_fallback:
  - moonshot
  - nvidia
  - gemini

# Scoring thresholds (0-10 scale)
scoring:
  most_relevant_threshold: 8.0
  somewhat_relevant_threshold: 5.0
  could_be_interesting_threshold: 3.0

# Output paths
output:
  digest_dir: "arxiv_digest"
  archive_subdir: "archive"
  obsidian_vault: null  # Optional: path to Obsidian vault

# API settings
api:
  arxiv_delay_seconds: 3.0
  arxiv_max_results_per_category: 100
  llm_retry_attempts: 3
  llm_retry_delay_seconds: 5.0
