- title: The In Situ Origins of Dwarf Stellar Outskirts in FIRE-2
  year: 2022
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ac6c88
  arxiv_id: '2109.05034'
  abstract: Extended, old, and round stellar halos appear to be ubiquitous around
    high-mass dwarf galaxies (10<SUP>8.5</SUP> &lt; M <SUB>⋆</SUB>/M <SUB>⊙</SUB>
    &lt; 10<SUP>9.6</SUP>) in the observed universe. However, it is unlikely that
    these dwarfs have undergone a sufficient number of minor mergers to form stellar
    halos that are composed of predominantly accreted stars. Here, we demonstrate
    that FIRE-2 (Feedback in Realistic Environments) cosmological zoom-in simulations
    are capable of producing dwarf galaxies with realistic structures, including both
    a thick disk and round stellar halo. Crucially, these stellar halos are formed
    in situ, largely via the outward migration of disk stars. However, there also
    exists a large population of "nondisky" dwarfs in FIRE-2 that lack a well-defined
    disk/halo and do not resemble the observed dwarf population. These nondisky dwarfs
    tend to be either more gas-poor or to have burstier recent star formation histories
    than the disky dwarfs, suggesting that star formation feedback may be preventing
    disk formation. Both classes of dwarfs underscore the power of a galaxy's intrinsic
    shape-which is a direct quantification of the distribution of the galaxy's stellar
    content-to interrogate the feedback implementation in simulated galaxies.
