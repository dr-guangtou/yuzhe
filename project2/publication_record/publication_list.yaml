- title: Ultra-diffuse Galaxies as Extreme Star-forming Environments. I. Mapping Star
    Formation in H i-rich UDGs
  year: 2022
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ac9964
  arxiv_id: ''
  abstract: Ultra-diffuse galaxies (UDGs) are both extreme products of galaxy evolution
    and extreme environments in which to test our understanding of star formation.
    In this work, we contrast the spatially resolved star formation activity of a
    sample of 22 H I-selected UDGs and 35 low-mass galaxies from the NASA Sloan Atlas
    (NSA) catalog within 120 Mpc. We employ a new joint spectral energy distribution
    fitting method to compute star formation rate and stellar mass surface density
    maps that leverage the high spatial resolution optical imaging data of the Hyper
    Suprime-Cam Subaru Strategic Program and the UV coverage of the Galaxy Evolution
    Explorer, along with H I radial profiles estimated from a subset of galaxies that
    have spatially resolved H I maps. We find that UDGs have low star formation efficiencies
    as a function of their atomic gas down to scales of 500 pc. We additionally find
    that the stellar mass-weighted sizes of our UDG sample are unremarkable when considered
    as a function of their H I mass-their stellar sizes are comparable to NSA dwarfs
    at fixed H I mass. This is a natural result in the picture where UDGs are forming
    stars normally, but at low efficiencies. We compare our results to predictions
    from contemporary models of galaxy formation, and find in particular that our
    observations are difficult to reproduce in models where UDGs undergo stellar expansion
    due to vigorous star formation feedback should bursty star formation be required
    down to z = 0.
