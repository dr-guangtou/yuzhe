- title: Beyond Ultra-diffuse Galaxies. I. Mass-Size Outliers among the Satellites
    of Milky Way Analogs
  year: 2023
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ace829
  arxiv_id: '2210.14994'
  abstract: Large diffuse galaxies are hard to find, but understanding the environments
    where they live, their numbers, and ultimately their origins, is of intense interest
    and importance for galaxy formation and evolution. Using Subaru's Hyper Suprime-Cam
    Strategic Survey Program, we perform a systematic search for low surface brightness
    galaxies and present novel and effective methods for detecting and modeling them.
    As a case study, we surveyed 922 Milky Way analogs in the nearby Universe (0.01
    &lt; z &lt; 0.04) and built a large sample of satellite galaxies that are outliers
    in the mass-size relation. These "ultra-puffy" galaxies (UPGs), defined to be
    1.5σ above the average mass-size relation, represent the tail of the satellite
    size distribution. We find that each MW analog hosts N <SUB>UPG</SUB> = 0.31 ±
    0.05 UPGs on average, which is consistent with but slightly lower than the observed
    abundance at this halo mass in the Local Volume. We also construct a sample of
    ultra-diffuse galaxies (UDGs) in MW analogs and find an abundance of N <SUB>UDG</SUB>
    = 0.44 ± 0.05 per host. With literature results, we confirm that the UDG abundance
    scales with the host halo mass following a sublinear power law. We argue that
    our definition of UPGs, which is based on the mass-size relation, is more physically
    motivated than the common definition of UDGs, which depends on the surface brightness
    and size cuts and thus yields different surface mass density cuts for quenched
    and star-forming galaxies.
