- title: 'PopSED: Population-level Inference for Galaxy Properties from Broadband
    Photometry with Neural Density Estimation'
  year: 2024
  journal: The Astronomical Journal
  doi: 10.3847/1538-3881/ad0be4
  arxiv_id: '2309.16958'
  abstract: We present POPSED , a framework for the population-level inference of
    galaxy properties from photometric data. Unlike the traditional approach of first
    analyzing individual galaxies and then combining the results to determine the
    physical properties of the entire galaxy population, we directly make the population
    distribution the inference objective. We train normalizing flows to approximate
    the population distribution by minimizing the Wasserstein distance between the
    synthetic photometry of the galaxy population and the observed data. We validate
    our method using mock observations and apply it to galaxies from the GAMA survey.
    POPSED reliably recovers the redshift and stellar mass distribution of 10<SUP>5</SUP>
    galaxies using broadband photometry within &lt;1 GPU hr, being 10<SUP>5-6</SUP>
    times faster than the traditional spectral energy distribution modeling method.
    From the population posterior, we also recover the star-forming main sequence
    for GAMA galaxies at z &lt; 0.1. With the unprecedented number of galaxies in
    upcoming surveys, our method offers an efficient tool for studying galaxy evolution
    and deriving redshift distributions for cosmological analyses.
