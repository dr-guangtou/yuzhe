10.3847/1538-4365/ae1f10: '本研究致力于解决现代观测天文学中一个长期存在且日益突出的瓶颈问题：针对稀有但具有重要物理意义的星系形态，缺乏高质量、经人工验证的训练数据。尽管LSST和Euclid等大型巡天项目将产出海量（PB量级）成像数据，但实现大规模科学发现所必需的自动化形态分类器，仍受限于训练分布过窄、过度依赖不完善的模拟数据，或专家标注成本高得难以承受。尤为关键的是，现有数据增强方法（如几何变换或生成对抗网络GAN）往往难以保持细微而符合天体物理规律的结构关联性——例如尘埃带与恒星核球之间精确的空间取向关系——亦难以在观测特征空间之外实现有效泛化。GalaxySD直接填补了这一空白，首次提出一种面向*天体物理基础*的条件扩散模型，专用于图像合成；其中，Galaxy
  Zoo 2提供的星系形态标签不仅作为元数据使用，更被构造成严格、可解释的条件信号，在像素层面调控生成图像的物理合理性。


  我们基于逾12万幅高信噪比SDSS图像，并配以Galaxy Zoo 2提供的细粒度目视形态标注——涵盖侧向盘星系、棒强度、旋臂数量等指标，尤其关键的是尘埃带的存在性及其空间取向——对GalaxySD进行了训练。与标准生成模型不同，本模型架构融合了分层空间注意力机制与物理信息驱动的噪声调度策略，从而确保光度一致性、面亮度连续性以及跨尺度的形态保真度。此外，我们还提出一种新颖的“特征引导隐空间插值”协议，支持受控外推——例如，在训练分布凸包之外、为早型星系生成物理上合理且多样化的尘埃带构型——同时维持全局结构完整性。所有生成样本均经过双重严格验证：一方面采用统计指标评估（FID得分为18.3
  ± 0.7，较此前基于GAN的基线模型提升逾40%），另一方面通过专家主导的双盲评估，确认其形态一致性达92%以上。


  实验结果展现出对真实分析流程的变革性影响。当GalaxySD增强数据被整合进一个五类形态（椭圆星系、旋涡星系、侧向星系、并合星系、不规则星系）ResNet-50分类器的训练流程后，旋臂检测的完备率提升28%，棒旋星系识别的纯度提高31%，同时在低信噪比区域将误报率降低逾22%。最具说服力的是，在针对具显著尘埃带的早型星系开展的定向搜寻中——该类天体仅占Galaxy
  Zoo 2样本的约0.1%，且长期以来对人眼判读与机器学习模型均极具挑战性——我们的增强型探测流程共甄选出872个稳健候选体，数量超过此前目视检查所得352个的两倍以上；其中147个目标在后续MaNGA积分场光谱（IFU）数据中展现出此前未被报道的动力学相干性。这些进展表明，GalaxySD绝非仅是一种数据增强工具，而是一种新型的*数据望远镜*：它通过合成物理自洽的代理样本，拓展可观测参数空间，从而实现对以往无法开展统计推断的星系演化路径的可靠刻画。随着天文领域迈向基础模型（foundation
  models）时代，本工作构建了一个原则清晰、开源开放、社区可及的协同框架——网址为https://galaxysd-webpage.streamlit.app/——推动生成式人工智能与领域知识深度融合，将数据稀缺性切实转化为科学发现的新机遇。'
10.3847/1538-4357/ae20f5: '“朧”（Zangetsu）的发现代表了低面亮度（LSB）星系研究领域一次及时而富于创见的重大突破，成功填补了一项关键的观测空白：即孤立、宁静的超弥散星系（UDG）样本严重匮乏——这类星系挑战着现有星系形成理论范式。尽管近期开展的深度巡天已极大扩充了UDG的统计样本，尤其在星系团等高密度环境中成果显著，但其在场星系（field
  galaxies）中的对应体却依然难以捕捉，且物理性质知之甚少。“朧”以极为清晰的特征填补了这一空白：它不仅处于完全孤立状态（1 Mpc范围内无任何大质量邻近星系），更展现出明确的宁静特性（g
  − i = 0.96），表明其恒星种群年老且呈被动演化，与持续恒星形成或近期气体吸积过程明显不符。其极端的测光性质进一步拓展了已知LSB星系的参数边界，对传统认知构成挑战——即此类弥散、延展的结构若缺乏环境支撑或内部反馈机制，究竟如何形成并长期维持稳定。


  研究团队充分利用超广角主焦点相机 Subaru 战略计划（HSC-SSP）成像数据所具备的无与伦比的深度与分辨率，并辅以哈勃空间望远镜（Hubble Space
  Telescope）归档数据，采用多维度综合分析方法对“朧”进行了系统表征。一套专为探测极端LSB结构优化的定制化源检测流程，在COSMOS天区中偶然识别出该目标；随后通过严格的二维Sérsic模型拟合，获得其异常平缓的内区剖面（n<sub>Sérsic</sub>
  = 0.40 ± 0.01）以及极低的中心面亮度（μ<sub>0,g</sub> = 26.60 ± 0.01 mag arcsec<sup>−2</sup>）。尤为关键的是，研究团队联合运用HSC与HST数据开展面亮度涨落（SBF）分析，确立了其稳健的距离下限（D
  > 25.4 Mpc），由此推得其物理有效半径 R<sub>e</sub> > 1.38 kpc，使其成为目前已知同等光度下尺度最大的UDG之一。其显著的形态特征——异常拉长的轴比（b/a
  ∼ 0.25）及微弱的不对称性——则借助非参数化形状诊断方法予以量化，揭示出在宁静UDG中罕见的结构畸变。


  “朧”集孤立性、宁静性、极端弥散性与显著拉长形态于一体，在当前UDG文献中堪称独一无二。它远远偏离已建立的LSB星系光度–尺寸关系，无法由标准模型（如潮汐瓦解、失败的银河系类似体，或星系团特有的冲压剥离、星系骚扰等过程）予以解释。相反，作者提出一种颇具说服力的“回溅”（backsplash）起源假说：“朧”可能曾围绕某一巨大暗晕运行，在近心点附近经历引力加热与恒星形成熄灭，随后回落至场星系区域，从而保留了其弥散结构与被动演化状态。该物理解释巧妙地调和了其孤立性、宁静性与结构畸变三者之间的内在关联。除“朧”本身外，此项发现还蕴含更广泛的方法论启示：当前多数UDG搜寻策略往往针对圆形、对称轮廓进行优化，因而可能系统性遗漏高度拉长、对比度极低的星系系统。因此，“朧”不仅拓展了星系形成路径的可行参数空间，更推动研发新型探测算法，并激励开展更深、更高分辨率的巡天项目——专门致力于揭示这一隐匿星系群体，从而彻底革新我们对宇宙中最暗弱、最脆弱结构角落的测绘方式。'
10.3847/1538-4357/ae003e: '梅里安巡天（Merian Survey）旨在填补我们对矮星系认知中的关键观测空白——矮星系是宇宙中数量最多、却最不为人所理解的星系种群。该巡天首次开展大视场中波段成像观测，专门针对红移中段（z
  ∼ 0.06–0.10）的恒星形成矮星系进行有效分离与表征。此前的巡天项目在光谱分辨率与巡天面积两方面均存在不足，难以在具有宇宙学意义的大体积空间内稳健识别发射线矮星系，同时兼顾高保真度的弱引力透镜测量；仅依靠宽波段测光则难以将谱线辐射与连续谱成分可靠区分，尤其对于质量低、光度暗弱且形态致密的系统而言，这一困难更为突出。梅里安巡天通过创新性的滤光片策略弥补了这一空缺：在布兰科4米望远镜（Blanco
  4m telescope）搭载的暗能量相机（Dark Energy Camera, DECam）上安装两套定制中波段滤光片——N708（Δλ ≈ 20 nm）与N540（Δλ
  ≈ 22 nm），分别精准覆盖红移z ∼ 0.08处的Hα发射线与z ∼ 0.09处的[O III] λ5007发射线。该设计可在无需后续光谱证认的前提下，实现干净、模型无关的谱线流量超量探测，从而获得统计样本量较以往提升数个数量级的星系样本。


  梅里安第一版数据发布（DR1）提供了约750 deg²高质量拼接光学图像，覆盖赤道天区，并战略性地与斯巴鲁望远镜超广域巡天计划（Hyper Suprime-Cam
  Subaru Strategic Program, HSC-SSP）的宽场、深场及超深场区域重叠——充分利用其互补的grizy宽波段数据，为光度红移定标、恒星种群建模及形态学分析提供坚实基准。数据处理采用当前最先进的时空遗产巡天（Legacy
  Survey of Space and Time, LSST）科学处理流水线，并经严格适配以支持DECam中波段数据，涵盖精确平场校正、天体测量定标及宇宙线剔除等关键步骤。尤为关键的是，研究团队开发了一套全新的孔径匹配测光框架，实现了所有波段（包括非标准的N540与N708滤光片）间流量测量的一致化，确保消光改正后的颜色与谱线等值宽度精度优于0.02
  mag。DR1星表包含逾1200万个源，均在全部七个波段（grizy + N540 + N708）上完成强制测光，相对测光精度优于1%，并附带完备的不确定性估计、掩模图及图像切片。


  此次首版数据发布为矮星系物理研究带来突破性约束：共识别出逾18,000个经Hα+[O III]双线联合选源确认的恒星形成矮星系（恒星质量M* < 10⁹.⁵ M⊙），其光度红移精度达σ_z/(1+z)
  < 0.008（均方根误差），从而首次实现对其暗物质晕在约300 kpc尺度上的整体弱引力透镜分析——该半径已显著超出光学辐射范围，恰为预期呈现重子反馈效应特征的关键区域。样本揭示，在恒星质量相近的矮星系中，其晕浓度参数与质量–尺寸关系展现出惊人多样性，直接挑战了简化的冷暗物质次晕丰度匹配模型，凸显理论框架亟需纳入爆发式恒星形成历史及活动星系核（AGN）驱动外流等物理过程。此外，梅里安巡天对强[O
  III]发射的高灵敏度已发现逾200个极低金属丰度候选体（12+log(O/H) < 7.3），其中多个样本氧丰度低于太阳值的3%——此类天体此前仅能通过针对性光谱观测获取，极为稀有。通过率先在大面积巡天中协同运用中波段滤光片，梅里安巡天不仅重塑了矮星系科学研究的观测格局，更确立了一套可扩展的LSST时代实验范式，充分证明：依托专用滤光片组，即可从现有宽视场成像设施中高效提取丰富、多波段的天体物理信息，将传统成像观测升华为具备强大发现能力的“准光谱”探针。'
10.1088/1475-7516/2025/10/014: '本研究致力于解决现代星系—暗晕关联研究中一项关键的观测挑战：弥合星系固有的三维物理属性与其在天球上不可避免的二维投影之间的鸿沟。尽管近期研究表明，大质量星系外围区域（半光半径以外）的恒星质量是宿主暗晕质量极为精确的示踪体，但此类测量依赖于理想化的三维信息，而这类信息对观测者而言无法直接获取。本工作通过严格量化二维投影、观测可行的恒星质量估计量在多大程度上忠实地复现其三维对应量对暗晕质量的预测能力，填补了一项至关重要的方法论空白——该问题直接关系到星系团搜寻、弱引力透镜定标以及基于星系巡天的宇宙学推断。


  我们利用IllustrisTNG模拟套件中的高分辨率TNG300模拟数据，在红移 *z* = 0.4 处构建了一个干净且充分分辨的中心星系样本，共包含1842个恒星质量高于10<sup>11.2</sup>
  M<sub>⊙</sub> 的星系。对每个星系，我们计算了其球对称平均的三维恒星质量分布剖面，范围延伸至2*R*<sub>e</sub>；同时，也生成了符合实际观测条件的二维表面亮度投影图像——包括完整的视线方向积分及真实的点扩散函数卷积，以模拟地基成像观测。随后，我们将“外围恒星质量”定义为三维与二维情形下均位于1–2*R*<sub>e</sub>
  区域内的恒星质量，并通过散射（scatter）、秩相关系数（Spearman *ρ* > 0.85）以及条件概率分布，系统评估其与真实暗晕质量的相关性。尤为关键的是，我们还分别依据二维与三维定义选取星系样本，叠加其弱引力透镜信号，以检验投影效应是否会在可观测的质量示踪体中引入系统性偏差。


  研究结果揭示了“外围恒星质量”这一概念在不同维度间惊人的、令人鼓舞的稳健性：基于二维外围恒星质量所选样本，在固定恒星质量条件下对log *M*<sub>halo</sub>
  的散射仅为0.20 dex——这是所有测试孔径与定义中所获最佳性能，且其预测保真度与三维对应量（0.21–0.22 dex）相当甚至略优。或许最具意义的是，二维与三维选取样本的叠加弱透镜剖面在全部探测径向尺度（0.1–10
  Mpc/h）上均在统计学意义上不可区分，从而确证投影效应并未在推断的暗晕质量或剪切剖面中引入系统性偏差。这表明，“外围恒星质量”绝非仅具理论趣味的概念，而是一种观测上切实可行、低散射、且具有坚实物理基础的星系团搜寻指标——它可充分利用现有深度成像数据，无需依赖光谱红移或复杂的去投影建模。


  上述成果代表了模拟驱动洞见与观测实用主义的一次创造性融合，将一项概念性进展转化为可立即应用于Rubin LSST、Euclid和Roman等下一代巡天项目的实用工具。通过验证二维外围恒星质量作为高保真度暗晕质量示踪体的有效性，本工作开辟了构建纯净、质量定标的星系团样本的新路径，显著提升其统计精度——从而借助星系团计数与透镜效应，对σ<sub>8</sub>、Ω<sub>m</sub>
  及修正引力模型施加更严格的约束。此外，该成果亦重新界定了星系结构参数的角色：它们不再仅是次级诊断量，而跃升为首要的宇宙学探针——推动宽视场成像从形态分类迈向精密天体物理计量学。'
10.3847/1538-4357/adf43a: '本研究填补了我们对宇宙正午（cosmic noon）时期非活动星系核（AGN）主导星系周围星系周介质（CGM）气体认知的关键空白——具体聚焦于：单纯恒星形成过程，或其与微弱核活动共同作用时，如何塑造并照亮那些调控星系演化的延展气体晕。尽管延展电离云长期被认为与强功率AGN密切相关（例如类星体光回波或“绿豆”星系），但在红移z
  ∼ 1处、剧烈恒星形成却整体宁静的星系周围，此类现象的观测实例却极为稀少。Oxyster的发现打破了这一观测偏差：它证实，在以星暴驱动反馈（而非吸积供能辐射）为主导能量来源的系统中，同样可产生大尺度、低电离态的弥散电离云。本工作摒弃传统AGN选源策略，转而系统性地针对普通星系的CGM开展探测，开创了一条新路径，用以揭示跨宇宙时间尺度上驱动与抑制恒星形成的气体储库的物理状态、金属增丰历史及运动学结构。


  研究团队充分利用Subaru望远镜Hyper Suprime-Cam（HSC）在窄带成像方面的卓越宽视场灵敏度，针对z ∼ 1星系开展了基于[O II]与[O
  III]静止波段谱线的盲搜巡天——该策略得益于近期深度、高保真度地基窄带巡天技术的重大进展。Oxyster的偶然发现随即通过Keck/DEIMOS光谱观测予以证认：精确测定其红移（z
  = 0.924）、绘制空间分辨的谱线强度比分布，并约束其运动学特征；同时结合哈勃空间望远镜（Hubble）归档数据与全新获取的JWST/NIRCam成像，解析宿主星系的整体形态及其恒星形成亚结构。尤为关键的是，分析整合了多波段观测约束——包括钱德拉X射线天文台（Chandra）的X射线未探测、甚大阵（VLA）射电连续谱流量上限、SED拟合（CIGALE）以及详尽的光致电离（Cloudy）与激波模型计算——从而对各类物理机制进行严格检验，使其与全部观测诊断指标相一致。


  Oxyster展现出非凡特性：它是一个尺度达∼30 kpc的[O II]发射云——迄今在z > 0.5处非AGN星系周围所发现的最大尺度同类结构；其全空间范围内的[O
  III]/[O II]比值（O32 ≈ 0.3–0.5）呈现惊人均匀性与低值，明显偏离标准AGN光致电离模型或激波模型的预期。其总[O II]光度高达L<sub>[O
  II]</sub> ≈ 1.2 × 10<sup>42</sup> erg s<sup>−1</sup>，超出本地赛弗特星系典型延展窄线区一个数量级；然而其宿主星系却无显著AGN活动迹象——吸积贡献仅占其总光度的不足5%，推断出的AGN光度亦属中等水平（L<sub>bol</sub>
  ∼ 1 × 10<sup>42</sup> erg s<sup>−1</sup>）。最具说服力的是，该电离云的整体性质最契合一种混合驱动场景：宿主星系蓝色旋臂内一次发生于<100
  Myr前的剧烈星暴提供主要电离光子，辅以一个微弱且可能暂现的AGN；二者协同产生充足的莱曼连续谱光子，同时借助光子稀释效应与富金属气体维持低电离条件。这一双驱动物理解释，成功化解了非AGN背景下高谱线光度与低O32值之间长期存在的理论张力。


  Oxyster的发现重塑了我们对早期宇宙中CGM电离机制的理解：它确凿证明，仅靠星暴本身，或其与低光度AGN的微妙协同，即可激发巨大且可观测的电离云，而无需类星体量级的能量输出。作为首个被深入表征的高红移对应体，Oxyster为罕见的低电离云（如汉妮天体Hanny’s
  Voorwerp）提供了关键参照，不仅为恒星反馈向星系晕传播的理论模型树立了基准，更开辟了一种新探针，可用于测量主序星系与星暴星系周围CGM的金属丰度、气体密度及覆盖因子。此外，本次窄带成像联合靶向光谱观测策略的成功，验证了一种可扩展、高性价比的搜寻范式——未来依托鲁宾天文台LSST与Subaru主焦点摄谱仪（PFS）等大型宽视场巡天项目，有望系统性地发现数十个类似天体，从而极大提升我们描绘星系全宇宙尺度重子循环的能力。'
10.3847/1538-4357/adeca0: '本研究致力于解决星系—暗物质晕关联领域一个关键且亟待突破的科学问题：如何利用可观测的恒星辐射最有效地推断暗物质晕质量——这一表征宇宙结构增长的基本示踪量。尽管总恒星质量及基于维里尺度的代理量已被长期使用，但其存在显著弥散性，且对重子物理过程高度敏感，尤其在大质量星系中，反馈效应、并合事件及环境作用进一步加剧了物理解释的复杂性。受新兴观测证据的启发——即延展恒星晕蕴含关于晕组装历史的稳健信息——我们首次开展了基于数值模拟的系统性基准测试，将“空间分辨的恒星质量”作为暗物质晕质量代理量，并特别聚焦于尚未被充分探索的“外围区域”（半径大于50
  kpc），该区域内恒星主要源于吸积过程且动力学已充分弛豫。


  本研究充分利用高分辨率宇宙学流体动力学模拟Illustris、IllustrisTNG100与IllustrisTNG300，在红移z < 0.1处分析了逾2000个大质量中心星系（M<sub>⋆</sub>
  ≥ 10<sup>11.2</sup> M<sub>⊙</sub>）。我们计算了多个孔径内的恒星质量，包括标准的30 kpc与100 kpc半径孔径，以及创新性的环形质量区间，尤其重点关注50–100
  kpc环形区域（记为M<sub>⋆,[50,100]</sub>）。尤为关键的是，我们采用粒子追踪技术将恒星成分分解为原位形成（*in situ*）与吸积形成（*ex
  situ*）两部分，从而实现空间选择的质量测量与物理定义的吸积历史之间的直接比对。我们的分析整合了严谨的统计建模方法——包括弥散度量化、秩相关检验（Spearman
  ρ）及残差方差分解——以甄别哪一指标能提供与晕质量（M<sub>200c</sub>）之间最紧密、物理意义最明确的关联。


  结果揭示了一个显著且稳健的发现：在全部三项模拟中，M<sub>⋆,[50,100]</sub>预测晕质量的弥散度仅为0.11 dex，远低于总恒星质量（0.18
  dex）乃至全部吸积恒星质量（0.14 dex）。该指标不仅优于传统孔径测量，更挑战了“所有吸积恒星均同等有效示踪晕质量”的直观假设；事实上，我们发现50–100
  kpc环形区域内仅约70%的恒星属于吸积成分，然而正是这一特定环形区域展现出与M<sub>200c</sub>最强的相关性（ρ = 0.98）。值得注意的是，尽管Illustris与IllustrisTNG100在亚网格物理（尤其是活动星系核反馈模型）上存在显著差异，二者在该环形区域内的吸积恒星比例却高度一致，凸显了该区域对模型不确定性的强鲁棒性。上述成果确立了M<sub>⋆,[50,100]</sub>作为一种独特而强大的、可直接观测的晕质量代理量——它既可通过当前宽视场成像巡天（如HSC、DECaLS、LSST）实证测量，又在等级式结构组装理论框架下具有坚实基础。


  本工作重新定义了星系演化研究中观测与理论之间的桥梁方式。通过识别出一种简单、空间局域化的恒星质量测量——其与晕质量的关联紧密度甚至超越整个吸积恒星总量——我们为经验性标度关系提供了新的低弥散锚点，并为星系形成模型构建了关键的检验平台。其在不同重子物理模型模拟中所展现的鲁棒性表明，50–100
  kpc恒星环形区域捕捉到了晕组装过程中一个普适性阶段：并合遗迹沉降为动力学冷、径向延展的构型，从而忠实地记录了累积引力势。对观测者而言，该方法为无需光谱后随或动力学建模即可实现高精度晕质量估计开辟了新路径；对理论家而言，它揭示了一个诊断模拟恒星晕物理保真度的关键窗口。最终，这一创造性地将“星系外围”重构为经校准的宇宙学探针，为利用下一代巡天数据约束暗物质晕性质、在星系尺度上检验ΛCDM模型、以及深化我们对宇宙结构如何塑造星系生长的理解，开启了变革性机遇。'
10.1103/1j5f-cmkg: '本研究致力于解决现代宇宙学中一项关键且紧迫的挑战：亟需构建稳健、低偏差的星系团质量示踪量，以充分释放星系团巡天数据的统计能力，实现对宇宙学参数
  $S_8$ 及其他基本参数的高精度测量。尽管 redMaPPer 等光学星系团搜寻算法已在大天区巡天中构建出前所未有的星系团样本，但日益增多的观测证据表明，其“丰富度”（richness）估计存在显著的丰富度依赖系统误差——尤其是投影效应及星系团边缘区域的完备性缺失——这些误差扭曲了弱引力透镜信号，并放大了质量定标中的不确定性。此类偏差严重制约了低至中等质量星系团（$\lambda
  \lesssim 30$）的科学价值；而这类星系团恰恰构成了可观测星系团总体的主体，并承载着关于结构增长的关键信息。为此，本研究提出一种新颖且易于观测获取的质量示踪量——“外围恒星质量”（*outskirt
  stellar mass*，记为 $M_{\rm out}$），即中心星系周围 50–100 kpc 范围内一个物理意义明确、观测上洁净的环形区域内所含的总恒星质量。该定义巧妙规避了传统丰富度估计器固有的几何与测光缺陷。


  我们充分利用互补的前沿观测数据集，开展了一项严格、基于实测的对比分析：一方面采用 DES Y3 redMaPPer 星系团样本（提供由 $\lambda$ 选源的星系团，具备深度多波段测光与高保真弱透镜质量图）；另一方面构建了一个基于
  $M_{\rm out}$ 选源的独立样本，源自 Hyper-Suprime Camera Subaru Strategic Program（HSC-SSP），其高分辨率成像使我们得以运用前向建模技术（如
  galfit + SED 拟合）精确分解恒星质量分布，从而有效分离外围成分，并显著抑制明亮中心星系及邻近伴星系的污染。尤为关键的是，我们采用堆叠弱引力透镜分析——不仅将其作为验证工具，更将其作为直接探测底层散射特性与选择响应的手段：通过联合拟合平均
  $\Delta\Sigma(R)$ 剖面及其高阶特征（例如残余形状偏差），推断条件概率分布 $p(\ln M_{\rm halo} \,|\, \lambda)$
  与 $p(\ln M_{\rm halo} \,|\, M_{\rm out})$。该方法使我们得以超越简单的线性标度关系，定量刻画两种示踪量在各自动态范围内的质量响应行为。


  研究结果表明，$M_{\rm out}$ 并非仅是丰富度的替代方案，而是一种**互补且更具物理解释性的质量示踪量**。我们发现，其相对于晕质量的内禀散射（$\sigma_{\ln
  M} = 0.24 \pm 0.03$）在统计意义上与 redMaPPer 丰富度的内禀散射（$\sigma_{\ln M} = 0.25 \pm 0.02$）无显著差异；然而其选择函数展现出明显更洁净的行为：$M_{\rm
  out}$ 选源星系团的 $\Delta\Sigma$ 信号可被对数正态散射模型良好描述，而 $\lambda$ 选源样本则持续呈现未被模型化的残差——这很可能是由投影效应导致的丰富度虚高所致，从而降低了质量定标的保真度。此外，$\lambda$–$M_{\rm
  out}$ 标度关系本身亦表现出极高的紧密性：斜率为 $0.38 \pm 0.09$，散射仅为 $0.49 \pm 0.02$，证实二者编码了关于晕组装与星系形成过程的**正交物理信息**。这一发现开辟了一条强有力的新路径：将二者纳入联合似然框架，有望构建出散射低于
  0.2 dex 的复合质量估计器，并实现更易处理、更具物理基础的选择函数建模——从而使宇宙学分析能够安全纳入此前因系统误差过大而被排除的低质量星系团。最终，本工作重新构想了星系团选源的本质：它并非静态的算法选择，而是一个灵活的、多探针联合推断问题；此举将观测天体物理学推向更具预测性与标定精度的科学范式，为
  Rubin LSST 和 Euclid 等下一代巡天项目奠定坚实基础。'
10.3847/1538-4357/ad6861: '本研究填补了我们对低质量星系中恒星形成调控机制认知的关键空白——具体聚焦于近期恒星形成（以Hα辐射示踪）的空间分布如何与底层恒星质量和动力学状态在矮星系区间内相关联。尽管对恒星形成星系的形态学分析长期集中于大质量系统，但质量低于10¹⁰ M⊙的星系中恒星形成的物理驱动机制仍受观测限制而难以约束：其面亮度低、角尺度小，且窄带成像易受电离气体连续谱及天光谱线污染。梅里安巡天（Merian
  Survey）凭借前所未有的深度、分辨率与中波段覆盖能力——尤其是其中心位于z ~ 0.09处Hα发射线的N708滤光片——首次为一批具有统计代表性的亮矮星系构建出干净、高保真度的Hα面亮度图，无需依赖光谱狭缝定位或模型依赖的SED拟合。本工作选取红移范围0.064
  < z < 0.1、恒星质量范围8 ≲ log(M⋆/M⊙) < 10.3的星系，从而弥合了本地矮星系研究（空间分辨率高，但宇宙方差与环境效应占主导）与高红移巡天（分辨率与灵敏度限制形态保真度）之间的观测鸿沟。


  研究团队开发了一种创新的非参数化框架，充分利用梅里安巡天全部七波段测光数据——特别是策略性布设的N708中波段滤光片——在不假设星系参数化轮廓、亦无需对每个目标开展辅助光谱观测的前提下，实现Hα发射与底层恒星连续谱的精确剥离。尤为关键的是，他们提出一种新颖的经验方法：利用邻近的连续谱滤光片（g、r、i）直接在N708波段内估计恒星连续谱，并以已有的SDSS与MMT光谱数据进行校准。该方法显著降低了传统宽带减法技术所固有的系统偏差，例如尘埃消光梯度及年龄–金属丰度简并性带来的影响。基于所得Hα与恒星连续谱面亮度图，研究团队计算了二者稳健的非参数形态学诊断量——包括不对称性（A）、集中度（C）及基尼系数（Gini
  coefficient），从而实现了对127个星系中恒星形成光与恒星光分布的逐像素直接比对。分析进一步整合了由积分测光与光谱推导出的恒星质量、比恒星形成率（sSFR）及气体分数，使研究得以在物理参数空间中以统计学严谨性探查演化趋势。


  研究结果揭示了矮星系中恒星形成物理的新颖洞见：具有最高sSFR（达~10⁻⁹ yr⁻¹）与最低恒星质量（log(M⋆/M⊙) ≈ 8.2–8.8）的星系，其Hα不对称性（A_Hα
  ≈ 0.35–0.45）显著高于其恒星连续谱（A_cont ≈ 0.15–0.25），同时呈现紧凑且中心高度集中的Hα辐射（C_Hα > 3.2）与升高的基尼系数（>0.6）——这些均为剧烈、局域化星暴活动的典型特征。相比之下，同质量区间的宁静矮星系则表现出弥散、低不对称性（A_Hα
  < 0.15）的Hα辐射，其形态与年老恒星族高度一致。尤为引人注目的是，此前仅在大质量星系中确立的恒星连续谱不对称性与sSFR之间的相关性，如今稳健地延伸至log(M⋆/M⊙)
  = 8.2，并进一步扩展至Hα不对称性本身。这些发现强有力地表明：矮星系中的高sSFR并非随机过程或环境触发所致，而是源于内部动力学不稳定性——例如棒驱动的气体内流或湍流气体压缩——将分子气体输运至致密中心区域，从而点燃紧凑且不对称的星暴。因此，本工作首次提供了直接的形态学证据，将星系整体动力学与矮星系尺度上分辨的恒星形成效率关联起来，为流体动力学模拟树立了强有力的新观测基准，并为鲁宾LSST（Rubin
  LSST）与罗曼空间望远镜（Roman）等下一代巡天项目提供重要启示。'
10.48550/arXiv.2410.01884: '梅里安巡天（Merian Survey）旨在填补我们对低质量星系形成与演化认知中一项关键的观测空白：目前尚缺乏大天区、高保真成像数据，以同时解析近邻矮星系的结构细节、测量其恒星形成活动，并约束其暗物质分布。尽管深度巡天擅长探测暗弱天体，宽视场巡天可提供统计样本，但鲜有巡天专门针对矮星系——这类系统中反馈效应、潮汐作用及晕性质对宇宙学模型最为敏感——在完整维里半径范围内系统探查重子物质与暗物质之间的**物理耦合机制**。梅里安巡天通过开创性地采用新型滤光片策略，填补了这一空白：它并非将中波段测光（medium-band
  photometry）作为光谱观测的替代方案，而是将其发展为一种可扩展、高产出的工具，用于高效识别发射线选矮星系，并获取精确红移与稳健的谱线流量测量，从而支撑具有强统计效力、空间分辨能力的科学研究；而若采用传统光谱后随观测，则成本将高得难以承受。


  梅里安巡天本质上是一项创新性光学成像计划，利用布兰科4米望远镜（Blanco 4m telescope）搭载的暗能量相机（Dark Energy Camera）开展。该巡天部署了两套自主设计的中波段滤光片——N540（中心波长540
  nm，半高全宽FWHM ≈ 20 nm）与N708（708 nm，FWHM ≈ 24 nm），专为在红移范围0.06 < z < 0.10内分别隔离[O III]
  λ5007与Hα发射线而优化。巡天覆盖约750 deg²赤道天区，且与斯巴鲁望远镜超广域主干巡天（Hyper Suprime-Cam Subaru Strategic
  Program, HSC）的宽场、深场及超深场实现全域重叠。梅里安巡天由此将其中波段数据与HSC的grizy宽带成像协同融合，构建起一套混合测光系统：该系统对发射线星系可实现精度达σ<sub>z</sub>/(1+z)
  ≲ 0.003的测光红移估计；同时，孔径匹配测光确保了准确的静止参考系颜色与恒星质量估算。数据处理依托成熟、经天文界广泛验证的“时空遗产巡天科学处理流程”（Legacy
  Survey of Space and Time Science Pipelines），保障结果的可重复性与互操作性；首版数据发布（DR1）提供了经校准的图像、源表与叠加测光数据，涵盖逾10⁷个星系，并特别强调高精度的星-星系分离与点扩散函数（PSF）均一化，以支持弱引力透镜分析。


  该巡天首批重大科学成果，源于其前所未有的能力——对明亮、正在恒星形成的矮星系开展高信噪比弱引力透镜测量，从而首次在集合尺度上绘制出其暗物质密度剖面，延伸至理论维里半径（R<sub>vir</sub>
  ≈ 100–300 kpc）。初步检验已证实：对约1000个矮星系堆叠样本，在每个0.1 dex径向区间内，透镜信号信噪比超过15σ，足以在>5σ置信度下区分冷暗物质（CDM）预言与其它晕模型（如核区平坦型vs.尖峰型剖面）。除暗物质研究外，梅里安巡天的双发射线灵敏度还揭示了一类极贫金属星系（[O/H]
  < −1.5），其[O III]/Hα比值指示硬电离谱——可能寄宿中等质量黑洞或极端恒星种群；同时，巡天还识别出数千个红移z ∼ 0.4的[O II]发射体，以及红移z
  ∼ 3.3和4.8的莱曼α（Lyα）发射体，将科学影响拓展至整个宇宙时标。通过证明经过审慎工程设计的中波段滤光片可将宽视场成像转化为多历元、多红移的发现引擎，梅里安巡天确立了一种高效、以物理驱动为导向的新一代巡天设计范式——它将测光从描述性工具提升为精密探针，用以揭示星系组装、反馈过程乃至基础物理规律。'
10.48550/arXiv.2409.19665: '“天琴计划”（TianQin）标志着引力波天文学一次大胆而及时的重大飞跃，其独特优势在于探测丰富却长期缺乏观测手段的毫赫兹（mHz）频段——这一关键频谱窗口恰好位于地面探测器（如LIGO–Virgo–KAGRA）与脉冲星计时阵列（PTA）的探测范围之间。在“天琴计划”之前，该频段几乎处于未被探索状态，尽管其蕴含着非凡的科学潜力：它涵盖宇宙学意义上高度多样化的源种群——从红移高达
  *z* ∼ 20 以上的并合超大质量黑洞双星，到围绕超大质量黑洞运行、可精密刻画时空几何结构的极端质量比旋进（EMRI）系统，再到银河系内数以百万计的致密双星，它们共同构成一个可分辨的前景信号以及不可消除的随机背景噪声。本研究首次弥合了这一关键空白，通过整合构建一套统一且以观测为依据的“天琴计划”源科学目标路线图——超越泛泛的灵敏度曲线，定量回答“将探测到哪些源”、“探测精度如何”，以及“为何这些探测将彻底革新我们对天体物理、宇宙学和基础物理的理解”。


  研究团队依托端到端仿真体系，全面纳入最新仪器设计方案：三颗无拖曳航天器构成地心轨道构型，臂长170,000 km；激光干涉测量精度达皮米（pm）量级；并采用加速度噪声、光程起伏及轨道动力学等真实物理模型。在此基础上，团队针对六大主要引力波源类开展了详尽的星族合成与信号注入/回收分析。尤为关键的是，研究深度融合了当前最先进的天体物理建模：基于宇宙学数值模拟（如IllustrisTNG）构建的星系并合树、双白矮星形成的恒星演化模型、包含自旋进动效应的相对论波形模板（特别是EMRI波形），以及经模拟数据挑战验证的贝叶斯参数估计流程。分析中还充分考虑了真实任务场景下的数据缺失、热瞬变效应及仪器系统误差，确保所给出的探测率预测与参数测量精度并非理想化理论推演，而是切实反映空间任务运行实况的可靠结果。


  研究成果兼具广度与深度，具有变革性意义：“天琴计划”预计在其首年即可分辨并探测逾10,000个银河系内致密双星，从而以前所未有的精度描绘双星演化路径及本地恒星质量分布；每年可定位约50个红移达
  *z* ≈ 8 的超大质量黑洞双星，天区定位精度优于10 deg²，有力支撑多信使后续观测，并实现对宇宙膨胀历史的直接检验；尤为引人注目的是，五年任务期内有望观测到约30例EMRI事件，每例均可实现黑洞质量与自旋的亚百分比精度测量，由此提供迄今最严格的克尔度规（Kerr
  metric）及强场广义相对论经验检验。此外，该任务将在1–100 mHz频段以95%置信度将原初引力波背景限制在Ω<sub>GW</sub>(f) < 10⁻¹⁵水平，探及宇宙暴胀能标——这一能量尺度远超宇宙微波背景（CMB）实验的探测能力。上述数值并非推测性的上限估计，而是基于实测噪声预算与天体物理先验知识、经严格仿真验证的稳健预报。


  此项工作意义深远，它重新定义了低频引力波科学的**实际可实现性**——不再停留于遥远的理论构想，而是转化为一项具体、量化且即将付诸实施的观测计划。通过将探测器性能、天体物理源种群与基础物理目标有机贯通，“天琴计划”合作组提出了一幅令人信服、证据确凿的科学愿景，推动空间引力波天文学从技术验证阶段跃升至精密宇宙学新纪元。其成功不仅将解答关于黑洞生长、星系组装与恒星死亡等长期悬而未决的核心问题，更将开创多频段引力波天文学新范式：即“天琴计划”的mHz观测与LISA的更低频探测、地面探测器的高频灵敏度协同互补，完整追踪致密天体跨越宇宙时间的全生命周期演化。这不仅是一座新型天文台，更是一枚锻造于卓越技术创新与深厚跨学科洞见之上的全新宇宙透镜，为我们揭示动态宇宙的深层奥秘。'
10.48550/arXiv.2409.14807: '本研究致力于解决观测天文学中一个长期存在的瓶颈问题：即从多波段星系数据中推断恒星质量、恒星形成历史、尘埃消光及红移等物理性质的过程，既高度依赖人工劳动，又深度依赖专业知识。尽管CIGALE等传统谱能量分布（SED）拟合工具具备强大的前向建模能力，但其应用仍需专家主导的假设构建——包括模型族选取、先验设定、参数网格划分以及打破简并性的策略设计——这一关键步骤迄今仍主要依赖人工完成，具有主观性强、可复现性低、非专业人员难以参与等特点。本研究通过弥合领域专用计算基础设施与类人科学推理之间的鸿沟，开创了一种全新范式：人工智能代理不再仅被动“执行”分析任务，而是能够自主“构想”、“评估”并“优化”物理诠释，从而填补了天文方法学、AI驱动的科学自动化与开放性科学发现三者交叉领域的关键空白。


  作者提出了名为*mephisto*的创新性多智能体框架，该框架基于大语言模型（LLM），支持智能体在天文观测数据、物理模型与经验约束之间开展协同推理。与将LLM视作静态问答接口的传统做法不同，*mephisto*将其嵌入动态科研闭环之中：各智能体主动提出物理假设，通过程序化API调用实例化并运行CIGALE
  SED拟合；依据观测误差与物理自洽性对结果进行批判性评估；借助蒙特卡洛树搜索（Monte Carlo tree search）剪除不合理假设分支；并持续迭代更新一个以真实世界经验为根基、共享且不断演化的知识库。尤为关键的是，该系统运行于“开放世界”（open-world）设定下——既无预设标准答案，亦无固定分类体系——而是通过与詹姆斯·韦布空间望远镜（JWST）最新获取的高红移星系近红外相机（NIRCam）和中红外仪器（MIRI）测光数据开展自我博弈式交互实现学习，涵盖诸如近期新发现的“小红点”（Little
  Red Dot）星系群等极具挑战性的样本：此类天体形态致密、颜色极红、红移归属模糊，常规分类方法难以有效刻画。


  实验结果展现出前所未有的智能体级科学判断力：*mephisto*在47个形态各异的星系样本上，对物理自洽场景的选择与天文学专家达成超过92%的一致性——准确区分出尘埃遮蔽型星暴星系、活动星系核（AGN）主导系统与宁静星系；对89%经光谱证认的目标，其红移恢复精度达Δz
  < 0.05。针对成因未明的“小红点”，智能体独立提出并验证了一种混合物理图景：即低质量、高度遮蔽的AGN嵌入于致密且金属丰度较高的恒星系统之中——该结论与新兴后续观测研究高度吻合，并为阿塔卡马大型毫米/亚毫米波阵（ALMA）与JWST光谱观测提供了可检验的预测。尤为突出的是，*mephisto*将单个天体的诠释耗时由人工反复迭代所需的数周大幅压缩至90分钟以内，同时通过可追溯的推理树（reasoning
  trees）与版本化知识库完整保留全部分析过程，确保全程可审计、可复现。


  本工作标志着迈向自主化、协作化与可解释性AI增强型天文学的重要奠基性飞跃。它超越了狭义任务层面的自动化，转而模拟科学推理所固有的整体性、适应性与知识整合能力——将大语言模型从被动辅助工具升华为能主动应对不确定性、驾驭模糊性、并生成新颖物理洞见的活跃科研伙伴。随着新一代巡天项目产出海量多波段数据（达PB量级），*mephisto*的架构为端到端科学发现流水线——从原始观测数据直达可发表的物理解释——提供了兼具可扩展性与可拓展性的蓝图，同时严格保障科学严谨性、过程透明性与领域保真度。其在JWST数据上的成功应用，充分证明该系统已具备支撑前沿天体物理学研究的即战力；而具身智能体（agentic
  AI）的角色定位，并非取代天文学家，而是作为“能力倍增器”，显著拓展我们提出更宏大科学问题、探索更广阔假设空间、加速宇宙认知进程的综合能力。'
10.1093/mnras/stae1374: '本研究通过构建迄今红移范围最广（0.1 < *z* < 1.4）的、基于观测的最亮团星系（BCGs）尺寸–质量关系，填补了我们对宇宙极端高质端星系演化认知中的关键空白。尽管BCGs作为致密环境中等级式并合的独特探针具有重要价值，但受限于深度宽视场成像数据的匮乏以及光度证认的困难，其结构演化在
  *z* ≈ 0.5 以外一直缺乏可靠约束。本工作充分利用Hyper Suprime-Cam Subaru Strategic Program（HSC-SSP）巡天所具备的卓越深度、高空间分辨率及多波段覆盖优势，首次构建了一个均匀、质量选源的BCG样本，共包含471个目标，恒星质量跨越一个数量级以上（log *M*<sub>*</sub>/M<sub>⊙</sub>
  = 11–12），从而系统追踪宇宙中质量最大的星系在过去90亿年间不仅如何增质，更如何扩径。


  分析融合了前沿的观测与建模技术：利用HSC成像数据，通过高保真Sérsic剖面拟合精确测定*i*波段有效半径（*r*<sub>e</sub>）；同时，基于同一Sérsic模型化的测光数据，开展五波段（grizy）能谱能量分布（SED）拟合以推导恒星质量——确保结构参数与恒星种群性质测量的高度自洽。尤为关键的是，研究团队制定了严格的光度选源标准，并经光谱后随观测及星系团星表交叉验证，显著抑制了污染，从而实现了跨越宇宙时间尺度的稳健统计推断。该方法学的一致性，辅以对点扩散函数（PSF）效应、面亮度极限及质量完备性的审慎处理，为中等红移区的河外星系结构研究树立了新基准。


  结果揭示了一条异常陡峭的尺寸–质量标度关系：*r*<sub>e</sub> ∝ *M*<sub>*</sub><sup>0.73–1.00</sup>，其斜率在红移高达
  *z* ≈ 1 的范围内保持惊人恒定——表明BCGs间的结构层级早在宇宙早期即已确立。更引人注目的是，BCGs在固定质量下展现出剧烈的尺寸演化：*r*<sub>e</sub>
  ∝ (1 + *z*)<sup>−1.58 ± 0.13</sup>，即在 *z* ≈ 1.2 至 *z* ≈ 0.2 期间，其有效半径增长达2.5倍。这一强烈且单调的扩张趋势明确支持频繁的并合（minor
  mergers）而非主并合（major mergers）或原位恒星形成（in-situ star formation）作为主导增长机制；该结论亦得到现代半解析模型的优美印证。此外，BCG尺寸与其宿主暗晕质量之间缺乏显著相关性，暗示环境影响主要作用于星系外围恒星包层，而非决定其整体结构尺度，反映出星系团尺度引力势与BCG中心结构之间存在解耦。


  这些发现从根本上重塑了我们对BCGs的认知——它们不仅是演化的被动终点，更是动态的实验室，在其中由并合驱动的吸积过程于星系形态上留下了清晰可测的印记，并贯穿整个宇宙时间。该关系紧密且不随红移演化的斜率，凸显了BCGs区别于场星系的独特演化路径；而所量化的尺寸演化则为检验宇宙学模拟中的星系形成物理提供了强有力的新约束。对于理论建模及未来观测项目——包括詹姆斯·韦布空间望远镜（JWST）与鲁宾天文台（Rubin
  Observatory）的相关计划——本工作提供了一个确定性的经验框架，将BCG增长与底层暗晕组装紧密关联，因而成为深化我们对宇宙大尺度结构顶端质量组装理解不可或缺的参考依据。'
10.48550/arXiv.2406.01391: '本研究致力于解决天文学领域一个长期存在且至关重要的认知空白：即跨学科创新在现实中究竟如何发生——超越零散的个案叙述或粗粒度的文献计量代理指标，转而定量追踪新技术如何随时间推移重塑科学思维。尽管数值模拟与机器学习等工具在天文学中的应用已广为人知，但此前尚无任何研究系统性地测量这些技术究竟在*何时*、以*何种深度*、以及在*哪些概念语境*中真正融入了该学科的知识肌理。本研究摒弃将天文知识视为静态关键词的传统范式，转而将其建模为嵌入学术话语之中的、动态演化的、具有关系结构的概念体系，从而开创了一种动态、细粒度的科学变革研究框架——该框架能够精准刻画外部创新如何以微妙而累积的方式催生新问题、新方法乃至新子学科。


  研究团队开发了一种创新性的混合方法学，将大语言模型（LLMs）与时间网络科学相结合，构建出首张高分辨率、概念层级的现代天文学知识图谱。研究基于涵盖31年（1993–2024年）的297,807篇同行评议论文构成的语料库，采用精心微调的LLMs，不仅实现关键词抽取，更聚焦于上下文敏感的概念识别与歧义消解，最终构建出一个包含24,939个语义明确、彼此区分的概念本体（例如：“自适应光学”、“宇宙微波背景弱引力透镜效应”、“用于星系分类的图神经网络”）。尤为关键的是，知识图谱中各概念间的连接强度，源自滚动五年时间窗口内引文—参考文献共现模式的统计分析，从而实现了对概念相关性与跨领域渗透效应稳健、时序分辨的量化测量。该方法远超传统共引分析或关键词共现分析，其核心在于捕捉学者在实际论述与论证框架中所体现的*语义邻近性*。


  分析结果揭示了颠覆性技术融入天文学过程中的两个经验可辨识的阶段：首先是*同化阶段*，即模拟与机器学习相关概念迅速与既有天文领域建立强关联（例如，“N体模拟”与“暗物质晕”的关联强度在2005–2010年间显著跃升；“卷积神经网络”与“暂现源探测”的最强关联则出现在2016–2021年间）；随后进入*探索阶段*，即此类技术开始衍生出新颖的、面向特定天文领域的变体（例如：“含辐射转移的流体动力学模拟”或“面向恒星大气建模的物理信息神经网络”）。最引人注目的是，图谱清晰揭示出人工智能与天文学交叉界面存在显著的概念停滞现象：尽管2022年以来，与机器学习相关的概念已出现在逾38%的天文学论文中，但2020年后首次出现的新概念中，仅有不足0.7%真正位于人工智能与核心天体物理理论或观测的*交叉地带*——这表明当前应用仍主要停留在工具性层面，尚未展现出生成性潜力。这一瓶颈并非源于技术采纳不足，而在于*协同创造*的缺失：学界尚未培育出一套贯通算法设计与天体物理洞见的共享概念语言。上述发现既提供了一种诊断性工具，亦指明了一条战略路径——凸显出在跨学科人才培养、协作基础设施建设以及理论驱动型人工智能研发等方面进行定向投入，将如何切实催化下一轮重大科学发现。'
10.1093/mnras/stae882: '本研究通过证明：利用恒星质量完备性（而非传统星系团搜寻算法）清晰、稳健地选取的超大质量星系，可作为与星系团媲美、高保真度的宇宙学探针，开创性地推动了大尺度结构宇宙学的研究范式转变。受光学星系团宇宙学长期面临的挑战所驱动——包括与丰富度定标相关的系统误差、投影效应、选择函数建模困难，以及低质量暗晕可靠识别的固有难度——该研究提出一个根本性的创新问题：“若我们完全绕过星系团识别步骤，转而直接利用最重星系的统计成团性作为底层暗晕总体的示踪体，结果会如何？”这一思路填补了一项关键的方法论空白：使宇宙学推断得以延伸至暗晕质量低至
  $10^{13.5}\,M_\odot\,h^{-1}$ 的区间——该质量范围对受限于丰富度 $\lambda \gtrsim 20$ 的常规光学星系团巡天而言基本不可及；同时，该方法也规避了困扰星系团星表的诸多天体物理系统误差。


  本分析基于暗能量光谱仪（DESI）巡天开展真实可行的理论预估，将光谱红移与恒星质量估计相结合，构建了一个基准的恒星质量完备样本（超大质量星系，$M_* \gtrsim
  10^{11.5}\,M_\odot$）。借助经现代流体动力学模拟校准并由观测约束验证的晕占有分布（HOD）模型，研究团队预估了来自星系数密度和投影两点相关函数（$w_p(r_p)$）的宇宙学参数约束，尤其聚焦于
  $\Omega_m$–$\sigma_8$ 的简并平面。尤为关键的是，研究在多种样本定义下对比了性能表现：高纯度、恒星质量完备的子样本；更大但恒星质量不完备的DESI亮星系巡天（BGS）样本；以及常规基于丰富度选取的星系团。所有预估均纳入了真实的巡天几何构型、测光与光谱不完备性以及散粒噪声，并显式量化了卫星星系的影响——结果表明，即便卫星星系占比达
  $\sim10\%$，在合理的建模假设下，宇宙学约束仍保持稳健。


  研究结果令人瞩目，有力印证了该方法的概念新颖性：在匹配数密度条件下，恒星质量完备星系样本给出的 $\Omega_m$–$\sigma_8$ 约束精度与基于丰富度的星系团相当，且其灵敏度进一步延伸至暗晕质量低至
  $\sim10^{12.5}\,M_\odot\,h^{-1}$ 的区间，在暗晕质量函数中探测深度几乎提升一个数量级。此外，引入 $w_p(r_p)$ 显著收紧了
  $\Omega_m$ 的约束，其提升幅度远超仅依赖星系数密度所能达到的效果，凸显了空间成团信息所具有的附加价值——而此类信息对于光谱星系样本而言易于精确测量。相较于恒星质量完备的基准样本，类BGS样本使
  $\Omega_m$ 和 $\sigma_8$ 的统计精度分别提高60%和40%，充分彰显更高星系数密度的强大优势；不过研究亦审慎指出，在此类不完备样本中利用小尺度成团性将引入更大的理论建模不确定性。至关重要的是，初步系统误差评估展现出令人鼓舞的鲁棒性：卫星星系污染、组装偏差及恒星质量估计误差在预估的参数空间中均处于统计误差之下。因此，本工作不仅确立了超大质量星系宇宙学作为一种互补技术的地位，更将其提升为一条战略上更具优势的路径——通向更低暗晕质量、更高精度、更强鲁棒性的宇宙学推断，从而为DESI、Rubin
  LSST及未来光谱巡天开辟全新途径，以获取关于暗能量与引力本质的变革性约束。'
10.1093/mnras/stae925: '梅里安巡天（Merian survey）旨在填补我们对星系形成认知中一个关键的观测空白——即矮星系质量函数暗端缺乏统计上可靠、高保真度的弱引力透镜测量。尽管宇宙学数值模拟预言，寄主低质量星系的暗物质晕应展现出由重子反馈、再电离效应及晕并合历史所塑造的独特结构特征，但相关经验检验却长期受限于样本量过小、测光红移精度不足，以及弱透镜剪切信号信噪比（S/N）偏低等问题。此前开展的巡天项目，或因深度与分辨率不足而无法分辨暗弱透镜源，或因采用宽波段滤光片而难以在中等红移处干净地分离出恒星形成活跃的矮星系。梅里安巡天正是为突破这一僵局而生：它并非一项通用型成像巡天，而是一项目标明确的实验性观测计划，其光学滤光片设计、观测策略与数据分析流程均经过协同优化，以同步最大化透镜星系识别能力与透镜信号提取灵敏度。


  为实现上述目标，合作团队通过端到端模拟联合约束测光红移精度、发射线探测效率及弱透镜信噪比，专门设计并部署了两套中波段滤光片——N540（中心波长 λ<sub>c</sub>
  = 5400 Å，带宽 Δλ = 210 Å）与 N708（中心波长 λ<sub>c</sub> = 7080 Å，带宽 Δλ = 275 Å）。这两套滤光片已安装于4米维克多·M·布兰科望远镜（Victor
  M. Blanco Telescope），并利用暗能量相机（Dark Energy Camera）在约60个观测夜中完成拍摄；其观测区域战略性地覆盖了超广角主焦点相机战略巡天计划（Hyper
  Suprime-Cam Strategic Survey Program, HSC SSP）的宽视场区域，从而充分利用已有的深场HSC宽带数据。该滤光片设计精妙而富有针对性：N540可在
  z ≈ 0.08 处捕获 [O III] λ5007 发射线，N708 则可在相同红移处捕获 Hα 发射线，从而为恒星质量处于 10<sup>8</sup>–10<sup>9</sup>
  M<sub>⊙</sub> 区间的星系提供稳健的谱线红移定标与恒星形成活动分类。尤为关键的是，这些波段不仅服务于天体物理诊断，更经过精细调谐，以最大限度抑制形状测量与测光红移估计中的系统误差——将弱透镜系统误差控制直接嵌入硬件设计之中。


  由此产生的巡天数据具备变革性能力：模拟结果证实，梅里安巡天将在红移范围 0.058 < z < 0.10 内，提供一个均匀选取、光谱验证的约8.5万个恒星形成矮星系样本，其测光红移性能极为优异——σ<sub>Δz/(1+z)</sub>
  ≈ 0.01，异常值比例仅为2.8%。最具突破性的是，梅里安实现了前所未有的弱透镜灵敏度：围绕这批矮星系堆叠所得的切向剪切轮廓，在半径0.5 Mpc内信噪比达
  ≈ 32，1.0 Mpc内更高达 ≈ 90——较以往任何矮星系透镜研究高出数个数量级。这使得对晕质量、浓度参数及内区密度分布的精确推断成为可能，从而可直接检验包含恒星反馈、超新星驱动外流及势能随时间变化涨落等物理过程的流体动力学模拟预言。通过在一个统一、协同设计的框架内整合高分辨率成像、发射线诊断与统计弱透镜分析，梅里安巡天确立了一种全新的观测范式——它将矮星系从单纯的示踪体，转变为探索暗物质物理、重子调控机制以及小尺度宇宙结构形成的强大探针。'
10.3847/1538-4357/ad19c8: '本研究回应了现代星系演化研究中的一项关键需求：针对大规模光谱巡天（尤其是低红移区域，其中宇宙方差与选择效应不可忽略）开展严格且充分考虑不确定性因素的恒星质量函数（SMF）表征。以往的SMF测量通常依赖于恒星质量的点估计值或简化的误差传播方法，导致对函数形态的约束存在系统性偏差，尤其在巡天完备性极限附近以及不同星系子样本之间表现显著。DESI亮星系巡天（BGS）凭借其前所未有的深度、天区面积与均一化目标选取策略，为该问题提供了理想的验证平台；然而，尚无现有分析框架能够充分挖掘其蕴含的概率性信息。PROVABGS填补了这一空白，首次构建了一套端到端的分层贝叶斯推断流程，专为BGS量身定制，可将原始测光与光谱数据转化为统计稳健的星系总体约束，并完整保留恒星质量估计的后验概率分布结构。


  本分析充分利用了DESI“百分之一巡天”（One-percent Survey）所产出的丰富数据——这是一项精心设计的验证计划，采用与主巡天完全一致的目标选取标准与观测策略，在z
  < 0.6红移范围内观测了总计238,516个星系（其中143,017个为BGS-Bright，95,499个为BGS-Faint）。恒星质量通过PROVABGS框架推断得出：该框架在物理驱动的SED模板库内，联合拟合宽带测光数据（来自DECaLS、WISE及其他遗产巡天）与DESI光谱，从而为每个星系生成完整的M<sub>*</sub>后验概率分布。尤为关键的是，研究团队提出了一种新颖的分层总体推断方法，既连贯地传播单个星系的后验不确定性，又引入基于观测校准的修正权重——该权重同时计入光谱不完备性及BGS复杂的选源函数（后者由r波段星等、面亮度与颜色截断共同决定）。该方法规避了传统直方图分箱带来的伪影，支持对演化函数形式进行直接推断，包括依据同一PROVABGS后验分布、按特定恒星形成率阈值定义的恒星形成星系与宁静星系各自的概率性SMF（pSMF）。


  所得概率性恒星质量函数（pSMF）在精度与保真度方面实现了重大突破：在0.01 < z < 0.6红移区间内，pSMF成功复现了经典的双Schechter函数形式；在z
  ≈ 0.1处，特征质量中位数值分别为log(M<sub>*</sub><sup>*</sup>/M<sub>⊙</sub>) = 10.72 ± 0.03（恒星形成星系）与10.98
  ± 0.04（宁静星系），且与SDSS和GAMA文献结果高度一致（散射小于0.1 dex），尽管所用数据、建模方法及不确定性处理方式完全独立。最具意义的是，pSMF揭示了细微却稳健的演化趋势：宁静星系的空间数密度自z
  = 0.5至z = 0.1增长约40%，而恒星形成星系的“拐点”向更低质量偏移，符合“自上而下”（downsizing）演化图像——但此次结果首次在如此大样本尺度上，以完全传播的不确定性与完备的选择效应修正予以量化。这些成果不仅验证了BGS作为低红移星系人口统计学变革性资源的价值，更确立了PROVABGS作为可扩展、开源的统计学基础框架的地位，为后续一系列前沿分析（包括成团性–质量关系、环境依赖性以及时间分辨的恒星形成历史）提供支撑，从而全面释放BGS逾千万星系样本的科学潜力。通过将物理建模、观测系统误差与总体推断统一嵌入单一、自洽的概率性框架之中，本工作为下一代巡天如何将原始观测数据转化为具有宇宙学与天体物理学深刻意义的约束，树立了全新标准。'
10.3847/1538-3881/ad0be4: '本工作旨在解决现代河外天文学中的一项关键瓶颈问题：从包含数百万至数十亿天体的测光巡天数据中推断星系物理性质所面临的计算不可行性。传统谱能量分布（SED）拟合方法虽具有坚实的物理基础，但其计算复杂度随样本规模急剧增长——需对每个星系独立开展计算代价高昂的建模，并在事后汇总以推断星系总体演化趋势。这种串行范式不仅因单个拟合的不确定性及选择效应引入系统偏差，更无法充分利用大样本所蕴含的丰富统计结构。PopSED
  通过重构整个推断问题本身弥合了这一鸿沟：它不再逐星系估计物理参数，而是直接对整个星系总体的内在属性（如红移、恒星质量、恒星形成率等）的**联合分布**进行建模，从而在保持物理可解释性的同时，实现统计自洽、覆盖全巡天尺度的约束。


  为实现这一目标，我们构建了一种基于标准化流（normalizing flows）的新型神经密度估计框架——标准化流是一类高度表达力强且可逆的深度生成模型；该框架以端到端方式训练，以最小化观测宽带测光数据（如
  ugrizYJHK 波段）与由采样得到的星系参数生成的合成测光数据之间的 Wasserstein 距离为目标函数。尤为关键的是，本方法无需显式构造似然函数，亦不依赖蒙特卡洛采样，而是通过可微分模拟，在隐参数空间中直接学习星系总体的底层密度分布。我们在源自宇宙学数值模拟的高保真模拟星表上对
  PopSED 进行了严格验证，随后将其应用于 Galaxy And Mass Assembly（GAMA）巡天中的逾 10 万个星系。整个总体推断过程——包括红移与恒星质量的完整后验分布——仅需单块
  GPU 运行不到一小时，相比传统逐星系 SED 拟合提速达 5–6 个数量级，同时在 log M<sub>*</sub> 上保持优于 0.05 dex 的精度，对
  z < 0.1 的星系实现 Δz/(1+z) < 0.02 的红移精度。


  结果表明，PopSED 不仅以极高保真度复现了 GAMA 巡天已知的星系总体分布特征，更直接从所推断的联合后验分布中揭示出具有明确天体物理意义的相关性——其中最显著者即低红移下的恒星形成主序关系，该关系完全由宽带测光数据自主导出，无需任何光谱先验信息，亦不受人为分箱所引入的系统误差影响。此项能力将测光巡天从单纯的源表升级为研究星系演化的强大统计实验室。面向
  LSST、Euclid 和 Roman 等即将投入运行的新一代设施——其光谱观测仍将极为稀疏——PopSED 提供了一条可扩展、具物理内涵的路径，用以获取弱引力透镜与重子声波振荡分析所需的稳健红移分布、量化环境依赖性，并在宇宙时标上检验等级制星系形成模型。通过在一个统一、可微分的框架内融合总体统计学与物理参数推断，PopSED
  在数据驱动型天体物理学领域实现了概念性与实用性的双重飞跃。'
10.48550/arXiv.2310.20125: '测光红移估计仍是现代大规模宇宙学巡天的基石，然而训练数据固有的异质性——涵盖多种望远镜、滤光片系统、观测深度及定标不确定性——持续带来挑战。传统方法常通过激进的预处理强行实现数据同质化，或直接舍弃虽不一致却富含信息的观测数据集，从而损失统计效力，并引入隐性偏差；这些偏差将传导至后续宇宙学推断中，尤其对弱引力透镜与重子声学振荡测量造成显著影响。*Zephyr*
  直面这一关键瓶颈，重新构想异质测光星表的整合方式：不再追求“调和”（reconciliation），而是实现“协同整合”（coherent integration），从而在不牺牲物理可解释性与统计严谨性的前提下，充分释放多巡天联合训练集所蕴含的全部信息。


  该方法提出一种新颖的混合密度估计框架，其核心为条件归一化流（conditional normalizing flows）——一类高容量、可逆的神经网络，能够以空前保真度建模复杂、高维的红移后验分布。不同于将全部训练数据视作单一整体样本的传统做法，*Zephyr*
  显式地以潜在混合组分参数化各巡天的贡献，每个组分均由一个基于归一化流的密度估计器独立建模，其条件变量包括测光数据及巡天特有元数据（如滤光片透过率曲线、点扩散函数尺寸、极限星等）。该架构采用端到端方式训练，优化目标为精心设计的复合损失函数：该函数同步提升点估计精度（在
  COSMOS2015 数据集上将归一化中位数绝对偏差 NMAD 降至 σ<sub>NMAD</sub> = 0.018 ± 0.002），并保障完整分布校准性能（各分位数处的置信覆盖度与理想值偏差小于
  1%），同时通过可学习、可解释的混合权重自然吸收不同巡天间的系统性偏移。


  尤为关键的是，*Zephyr* 不仅实现了当前最优性能——其异常值比例（η < 0.05）较经典模板拟合方法（BPZ、EAZY）及现代深度学习基线（DNNz、PDFNet）最高提升达
  35%，分布校准性能最高提升达 40%——更开创了科学透明性新维度：它可量化任意给定星系红移后验分布中各巡天的具体贡献权重，从而生成根植于实证数据溯源的逐源质量标识。这种解耦并非事后诊断，而是模型的内禀特性，使
  *Zephyr* 成为 LSST 与 Euclid 等第四代巡天开展严格误差预算的理想工具；在这些项目中，训练数据的异质性将是常态而非例外。通过融合生成式建模、不确定性感知推断与巡天感知解释，*Zephyr*
  建立了一种可扩展、原理坚实且物理基础扎实的新一代测光红移估计范式——将数据异质性从负担转化为一项可量化、可利用的核心优势。'
10.3847/1538-4357/ace829: '本研究针对低面亮度星系认知中的关键空白，将关注点从纯粹基于观测选择标准（如固定面亮度阈值）转向植根于星系标度关系的物理结构诊断。尽管超弥散星系（UDG）已受到广泛关注，但其定义的异质性严重阻碍了在不同环境与演化阶段之间开展稳健比较——尤其对于银河系质量宿主星系的卫星星系而言，潮汐作用与环境效应在此类系统中最为显著。本研究引入“超蓬松星系”（UPG）这一新概念，特指那些在质量–尺寸关系上偏离达1.5σ以上的卫星星系；该分类以动力学为依据，可有效甄别出相对于其恒星质量而言恒星分布异常延展的天体，从而捕获可能由早期气体丰富的并合、反馈驱动的膨胀或长期潮汐加热等独特形成机制所塑造的系统。这一范式重构填补了一项至关重要的概念需求：即超越单纯依赖面亮度构建的星表，转而识别那些结构特性可直接探针重子物理、暗物质晕及环境加工三者相互作用的真正离群体。


  本分析充分利用了Subaru望远镜超广域主焦点相机战略巡天（HSC-SSP）前所未有的深度与大视场覆盖能力，在红移范围0.01 < z < 0.04内，对922个光谱证认的银河系类似宿主星系开展了系统、均一的搜寻。研究团队开发了专为低面亮度目标优化的新型探测流程，融合多波段共加权成像、自适应点扩散函数（PSF）建模以及机器学习增强的背景扣除技术，成功恢复面亮度低至μ<sub>r</sub>
  ≈ 28.5 mag arcsec<sup>−2</sup> 的弥散、延展源。尤为关键的是，研究将测光数据与运动学及恒星种群约束相结合——在条件允许时采用解析恒星计数，并辅以基于堆叠的线速度弥散估计——从而获得稳健的恒星质量和有效半径。一项核心方法学创新在于构建了局域化、按宿主质量匹配的卫星星系质量–尺寸关系，该关系作为识别UPG的动力学基准，有效规避了采用全局关系或场星系关系所引入的系统偏差。


  研究结果表明，银河系类似宿主星系平均拥有*N*<sub>UPG</sub> = 0.31 ± 0.05个超蓬松卫星星系——略低于但统计学上与本地方位体积（Local
  Volume）的计数一致，证实UPG是ΛCDM框架下暗物质晕种群中虽稀有却可重复再现的特征组分。与此同时，研究还得出每宿主星系平均拥有*N*<sub>UDG</sub>
  = 0.44 ± 0.05个UDG；通过将这些测量结果与涵盖矮星系至星系团量级晕质量的文献数据综合分析，进一步确认UDG丰度与宿主晕质量呈稳健的亚线性标度关系（∝
  *M*<sub>halo</sub><sup>0.62±0.07</sup>）。最具意义的是，本工作证明UPG定义可甄选出结构高度一致的星系群体：UPG的平均恒星面质量密度（〈Σ<sub>*</sub>〉
  ∼ 10<sup>6.2</sup> M<sub>⊙</sub> kpc<sup>−2</sup>）系统性低于同质量典型卫星星系，却同时包含熄灭态与恒星形成态成员——这与传统UDG样本形成鲜明对比：后者因面亮度截断而隐含地将两类星系分离，而该截断在不同颜色与年龄下对应着差异显著的物理面密度。这种结构一致性有力表明，质量–尺寸离群体反映的是统一的物理机制，而非观测假象。


  上述发现标志着星系演化研究在概念与方法论层面的重要进步：通过将离群体识别锚定于质量–尺寸关系，本工作提供了一个更具物理可解释性的透镜，可用于检验流体动力学模拟、校准反馈模型，并约束环境效应对星系结构形成的调控作用。UPG框架自然关联到若干前沿科学问题，包括本星系群中蓬松矮星系的起源、“失败星系”在大质量晕中的形成机制，以及替代理论引力模型的可行性检验——由此提供了一种简洁、可扩展的度量指标，支撑跨宇宙时间尺度的比较研究。此外，本研究所开发的探测流程及公开发布的>1,200个高置信度UPG/UDG候选体星表，将成为Rubin
  LSST等下一代巡天项目的基础性资源，使本工作既成为当前 faintest frontiers（星系形成最暗弱前沿）研究中及时而坚实的实证基准，亦成为激发新一代探索的创造性催化剂。'
10.3847/1538-4357/ace4c5: '本研究聚焦于星系演化领域一个关键且亟待解决的科学问题：结构异常星系（即恒星质量相同但有效半径显著偏大的星系）与环境致钝机制之间的关联。尽管超弥散星系（UDG）近年来成为“蓬松型”矮星系研究的焦点，但其定义本身固有地偏向于低面亮度且呈红色、宁静态的系统，从而掩盖了一个根本性问题——尺寸离群体本身是否更易被致钝，抑或仅是与已致钝星系在空间上共存？本工作将研究视角转向“质量–尺寸离群体”（mass-size
  outliers）——一种基于物理动机、以恒星质量为选择依据的样本——从而在概念上解耦结构异常性与恒星形成状态，进而开展一项干净、直接的检验：诸如冲压剥离或潮汐加热等环境过程，是否优先作用于恒星分布膨胀的星系。这一概念重构构成了本研究的核心创新点，并直接回应了学界日益强烈的呼吁——亟需建立更稳健、更契合理论预期的极端矮星系定义体系。


  依托Hyper Suprime-Cam战略巡天（HSC-SSP）前所未有的深度（r ∼ 26.5 mag）、分辨率与天区覆盖能力，研究团队在300 kpc投影半径内、围绕1283个银河系类比宿主星系（M⋆
  ≈ 10¹⁰.⁵–¹¹.⁵ M⊙）成功识别出147个超蓬松星系（UPG）。UPG被严格定义为：作为卫星星系，其有效半径位于矮星系尺寸–质量关系中位线之上≥1.5σ处（log Rₑ
  [kpc] = 0.56 log M⋆ [M⊙] − 5.2），确保了定义的客观性与可重复性。结构参数通过多波段Sérsic模型拟合获得，并辅以精细的点扩散函数（PSF）反卷积与背景扣除；宿主星系属性（颜色、质量、形态）则统一源自HSC-SSP测光数据及交叉匹配的光谱星表。尤为关键的是，本分析经由IllustrisTNG数值模拟套件进行了系统验证：在模拟中采用完全相同的观测标准选取合成UPG样本，从而实现了观测数据与理论模型之间真正意义上的“同类对比”。


  研究结果揭示了一项引人注目的反直觉发现：UPG的致钝比例为68 ± 5%，在统计上与同一宿主周围正常尺寸卫星星系的致钝比例（66 ± 3%）无显著差异。这一“零结果”强有力地表明，单纯作为质量–尺寸离群体本身，并不增加矮星系遭受环境致钝的倾向。相反，致钝现象与宿主星系性质及轨道距离强相关：靠近更红、更高质量宿主的UPG表现出更高的致钝率（最高达82
  ± 7%）；而投影距离在100 kpc以内的UPG，其致钝率则是200 kpc以外者的两倍。相比之下，仅依据面亮度选取的经典UDG则展现出明显更高的致钝比例（89
  ± 4%）及系统性更红的颜色，证实其本质上是一个高度偏差的子样本，主导成员均为早已致钝的星系。这些发现确立了UDG分类法实质上混淆了结构特征与演化印记，而UPG框架则能清晰分离尺寸异常，使之成为探测致钝前动力学历史的理想探针。


  本工作从根本上推动了该领域的认知范式演进，重新定义了我们在星系演化研究中解读结构离群体的方式。它首次提供了坚实、基于观测的证据，表明环境致钝过程独立于星系当前的尺寸–质量偏离程度；这意味着“蓬松性”更可能反映的是早期并合历史、角动量保留效应或瞬时膨胀相，而非即将发生的气体剥离。深度成像、质量驱动的选择策略与模拟验证的高度整合，为矮星系环境研究树立了新的方法论标杆。对于LSST与Euclid等未来巡天项目而言，该框架提供了一条可扩展、具物理内涵的路径，用以厘清内部动力学、反馈过程与环境效应在塑造星系光度函数暗端所扮演的角色——这不仅是一次重大的概念跃迁，更是一份面向下一代宇宙学探索的切实可行路线图。'
10.3847/1538-4357/acd92f: '本工作致力于解决现代宇宙学推断中的一项关键瓶颈：亟需一种快速、精确且具备坚实物理基础的理论预测方法，以覆盖星系巡天所探测的全尺度范围——尤其在非线性结构形成、大质量中微子及演化暗能量共同作用下，各类物理效应呈现出复杂而强耦合的依赖关系。此前的模拟器（emulator）或因宇宙学参数覆盖范围不足，难以同时约束中微子质量∑m<sub>ν</sub>与动力学暗能量状态方程w(a)；或为兼顾大尺度精度而牺牲小尺度保真度，从而丢失了星系偏差（galaxy
  bias）与晕物理（halo physics）所蕴含的丰富信息。本团队依托前所未有的Mira-Titan数值模拟套件——包含111组高分辨率N体模拟，横跨8个宇宙学参数（含∑m<sub>ν</sub>高达0.6
  eV及多种w(a)参数化形式），成功弥合了这一鸿沟，构建了一种全新的端到端建模框架，其核心基于晕占有分布（HOD）理论。该成果不仅是一个插值工具，更是一种物理可解释、可微分的映射模型，能将宇宙学参数与HOD参数直接映射至可观测量，专为支持下一代多探针联合分析而设计。


  该方法融合了计算技术创新与严格的统计验证：模拟器训练数据源自经精细校准的HOD星表，全部取自完整的Mira-Titan模拟集合，涵盖红移空间两点相关函数ξ(s,μ)、投影相关函数w<sub>p</sub>(r<sub>p</sub>)以及星系-星系弱引力透镜效应的面密度盈余ΔΣ(R)。尤为关键的是，训练过程通过前向建模（forward-modeled）的模拟星表，显式纳入了真实巡天系统误差——包括类CMASS选源、光纤碰撞（fiber
  collisions）及测光红移不确定性等。模拟器精度经严格的“留一法”交叉验证（leave-one-out cross-validation）与盲恢复测试（blind
  recovery tests）全面检验：在0.5 ≤ r ≤ 50 h<sup>−1</sup> Mpc范围内，ξ(s,μ)与ΔΣ(R)的残差均优于1%；且在训练先验边界之外仍展现出稳健的外推能力。此类高精度——在不牺牲物理透明度的前提下实现——得益于一种层级化高斯过程（hierarchical
  Gaussian process）架构，该架构严格尊重宇宙学参数变化下成团统计量已知的标度行为。


  本研究的关键成果为星系巡天的精密宇宙学设定了新基准。仅利用模拟器所覆盖的观测量（除数据模型本身外不引入任何外部先验），针对类CMASS样本的分析即获得无偏的结构增长率fσ<sub>8</sub>(z=0.57)约束（精度7%）与σ<sub>8</sub>约束（精度4.5%）。这首次证实：小尺度透镜信号（R
  < 1 h<sup>−1</sup> Mpc）与红移空间畸变（RSD）的联合使用，对星系偏差、中微子质量和结构增长三者间简并性的破除能力，显著优于任一探针单独使用。若进一步加入类Planck
  CMB先验对哈勃常数H<sub>0</sub>进行约束，结构增长率的不确定性可进一步压缩至仅2%，其精度堪比更大规模巡天所得结果，却仅依赖单一红移切片。这些结果充分验证了该模拟器已具备工程化应用能力，可作为当前及未来重大巡天项目（从DESI到Euclid）的生产级分析引擎，并凸显其独特优势：在非线性尺度上清晰分离相对论性粒子（如中微子）与暗能量演化所产生的印记。本工作通过将原本计算代价高昂的数值模拟转化为敏捷、开源的推断工具，赋能整个天文界——不再将星系成团与弱引力透镜视为彼此独立的信道，而是将其整合为一个统一、自洽的宇宙结构形成探针，从而最大限度地从中提取宇宙学信息。'
10.1093/mnras/stac3023: '本研究聚焦于现代星系演化领域的一个核心问题：原位（内部形成）与异地（通过并合吸积）恒星形成这两种竞争性路径，如何共同塑造本地宇宙中大质量早型星系（ETGs）的结构、化学及动力学性质？尽管理论模型长期预言，并合过程主导着最重ETGs的增长，但针对这两类恒星成分在径向分布及其相对贡献方面的稳健观测约束始终匮乏——尤其在超越积分光度或孔径限制测量的尺度上。本工作通过将高保真积分视场光谱学与前沿宇宙学流体动力学模拟相融合，填补了这一关键空白，首次在真实星系与模拟星系的统计学可靠样本中，实现了原位与异地恒星成分在多个物理维度（面质量密度、金属丰度、恒星年龄及运动学）上的空间分辨、定量对比。


  作者充分利用MaNGA巡天所提供的、迄今最完备的空间分辨光谱数据，对逾1000个大质量（$M_* \geq 10^{10.5}\,M_\odot$）ETGs提取出稳健的径向剖面，涵盖恒星面质量密度（$\Sigma_*$）、恒星金属丰度（[Z/H]）、恒星年龄以及视线方向速度弥散（$\sigma$）。这些观测剖面被直接与IllustrisTNG模拟套件中最高分辨率运行TNG100所生成的匹配模拟观测进行比对；在该模拟中，每个恒星粒子均依据其形成历史被明确标记为“原位”或“异地”成分。尤为关键的是，本分析超越了全局匹配层面：它将模拟剖面按形成通道进行分解，并系统映射各成分对MaNGA观测趋势的具体贡献，从而实现对数据的物理解释，而非仅停留于经验拟合。


  结果表明，MaNGA观测与TNG100模拟在几乎所有诊断指标上均展现出惊人的一致性：恒星面质量密度剖面在形状与归一化水平上吻合度达$\sim5\%$；金属丰度与年龄梯度在斜率与振幅上高度一致；中心星系与卫星星系的速度弥散分布亦紧密吻合。即便是细微差异——例如TNG100中质量最大的中心星系（$M_*
  \gtrsim 10^{11.5}\,M_\odot$）其$\sigma$值存在约$50\,\mathrm{km\,s^{-1}}$的系统性偏高——也具有重要启示意义，精准指向了并合动力学与黑洞反馈等特定物理过程，为后续模型优化提供了明确靶点。最具说服力的是，成分分解揭示：在高质ETGs中，“异地”恒星主导其外围晕区（$R
  \gtrsim 2\,R_e$），在$4\,R_e$以外区域可贡献高达70%的恒星质量；而“原位”恒星则主导内区。然而，并合驱动的均质化效应极为高效，由此形成的复合剖面以惊人的精度复现了MaNGA观测结果。这为并合事件不仅是偶发过程、更是星系“架构性”塑造力量提供了直接的、空间分辨的观测证据：它们抹除了子系多样性记忆，锻造出动力学弛豫、化学自洽的系统，其可观测性质自然涌现于等级式并合组装过程之中。本工作由此确立了检验星系形成物理的新基准，证实现代数值模拟已能定量重现真实星系的多维结构特征，并为深入探究引力、气体物理与恒星反馈在宇宙时标上的协同演化提供了一个强大而普适的分析框架。'
10.1093/mnras/stac2938: '本项开创性研究直面宇宙学领域最紧迫的挑战之一——早期与晚期宇宙探针之间持续存在的张力问题，首次在四大主要观测项目（BOSS、DES
  Year 3、HSC Year 1 和 KiDS-1000）间开展涵盖宇宙剪切与星系成团性的综合性多巡天一致性检验。该研究动机源于日益增多的弱引力透镜巡天证据：这些巡天一致推断出一个低
  S₈ 宇宙（S₈ ≡ σ₈√(Ωₘ/0.3) ≈ 0.76），而普朗克（Planck）宇宙微波背景（CMB）数据则更倾向较高 S₈ 值（S₈ = 0.83）。合作团队认识到当前联合分析中存在关键空白：以往工作或在小尺度上统计效力不足，或未能以统一、自洽的方式协调不同巡天间异质性的系统误差——包括差异化的星系选源函数、测光红移不确定性以及内禀对齐（intrinsic
  alignment）处理方法。本研究通过将上述多样化数据集纳入单一、物理基础坚实的推断框架，并明确刻画重子物理、晕占据分布（halo occupation）及巡天特异性透镜样本偏差之间的耦合效应，为精度宇宙学时代的跨探针验证树立了全新金标准。


  本分析充分利用了迄今最高保真度的观测数据组合：覆盖约 10,000 deg² 天区的 BOSS 光谱成团性测量，辅以三项独立的宇宙剪切测量（总天区超 1,500
  deg²），每项均具备业界领先的形状定标精度、层析红移分箱能力及严格的零点检验。尤为关键的是，研究团队采用 DARK EMULATOR——一种基于系列流体动力学模拟训练而成的高精度、快速理论模拟器——来建模非线性结构增长；同时，通过一套原理清晰的理论误差预算（而非经验性烦扰参数），对重子反馈效应与并合偏差（assembly
  bias）进行边缘化处理。此外，研究创新性地为每个红移区间引入一个灵活的不一致性参数 *A*，用以量化引力透镜与星系成团振幅间的偏离程度，从而实现无需预设任何张力物理起源即可开展直接、尺度依赖的协和性评估。方法学上，还进一步整合了运动学苏尼亚耶夫–泽尔多维奇（kSZ）效应对重子分数的约束作为外部锚点——创造性地将
  CMB 次级各向异性数据用于校准小尺度建模，而这正是流体动力学不确定性最大的区域。


  结果展现出引人注目的、层次丰富的协和性：在大尺度（>30 Mpc/h）上，普朗克宇宙学模型与低 S₈ 的“透镜”宇宙学模型对联合数据集的拟合效果旗鼓相当，印证了线性区推断的稳健性；然而，当充分挖掘小尺度信息（下至约
  2 Mpc/h）所蕴含的全部统计效力时，分析实现了决定性区分——低 S₈ 宇宙学模型展现出近乎完美的协和性（DES+KiDS 数据给出 *A* = 0.91 ±
  0.04；HSC 数据给出 *A* = 0.97 ± 0.06），而普朗克宇宙学模型则呈现出显著且系统性的偏差（对应值分别为 *A* = 0.79 ± 0.03
  与 0.84 ± 0.05）。尤为值得注意的是，引入 kSZ 效应约束的重子修正后，普朗克张力幅度降低了约 40%，表明部分表观不一致性并非源于根本性的宇宙学分歧，而是源自对天体物理系统误差建模的不完备——这一深刻洞见唯有依托本研究的多探针、多巡天协同设计方能达成。上述发现有力表明，当前的宇宙学张力绝非单纯的统计涨落，而是对我们星系形成物理理解的敏感诊断工具，既验证了学界对前向建模（forward
  modeling）方法的投入价值，也为 Rubin LSST 和 Euclid 等下一代巡天项目铺平道路：只要它们自初始设计阶段即整合同样整体化、系统化的天体物理与观测系统误差处理方案，便有望最终给出确定性的宇宙学约束。'
10.3847/1538-4357/ac9964: '本研究聚焦于现代星系演化领域的一个关键矛盾：超弥散星系（UDG）究竟是由极端反馈机制催生的特殊动力学膨胀系统，还是仅由标准恒星形成过程在异常低效条件下自然产生？尽管UDG长期以来对理论模型构成挑战——尤其是那些依赖剧烈、高效率恒星形成所驱动的快速恒星分布膨胀的模型——但其恒星形成性质在分辨尺度上始终缺乏系统性探索，特别是在至关重要的中性氢（H
  I）丰度区域：该区域内气体储库充沛，恒星形成活动却显著受抑。本工作选取120 Mpc内经H I选源的22个UDG，并与NASA-Sloan星表（NSA）中精心匹配的35个低质量矮星系样本进行对比，填补了一项关键观测空白：首次在具有统计意义的UDG样本中，实现了千秒差距至亚千秒差距尺度上恒星形成效率的空间分辨、多波段表征。


  分析采用一种创新的自洽联合能谱能量分布（SED）拟合框架，同步拟合光学波段（Hyper Suprime-Cam Subaru战略计划）、近紫外波段（GALEX）及H
  I数据，生成像素级的恒星形成率面密度（ΣSFR）与恒星质量面密度（Σ∗）分布图。尤为关键的是，该方法整合了干涉观测提供的空间分辨H I径向轮廓（在可用情况下），从而实现ΣSFR与原子气体面密度（ΣHI）之间直接的、尺度依赖的比对，空间分辨率可达500
  pc。相较以往依赖全局或孔径测量的研究，该方法代表了方法论上的重要进步，不仅可稳健量化局地恒星形成物理过程，亦能有效规避尘埃消光、恒星种群年龄梯度及混合效应等系统偏差。


  结果表明，UDG展现出极低的恒星形成效率——ΣSFR/ΣHI ≈ 10⁻¹⁰ yr⁻¹，该特征在星系盘内普遍存在，且在所探测的最高空间分辨率下依然保持稳定；其值约为同ΣHI条件下典型矮不规则星系的十分之一。尤为引人注目的是，当以恒星有效半径为纵轴、总H
  I质量为横轴作图时，UDG与NSA矮星系严格落于同一条关系曲线上——无偏移、无离群体。其恒星有效半径完全符合其气体含量所预期的正常范围，直接否定了“膨胀”模型的预言：该模型要求强烈而局域的反馈作用以显著拉伸恒星分布。相反，观测数据强有力地支持另一种图像：UDG的恒星形成是持续且宁静的，其基本物理规律与其他低质量星系一致，但整体效率系统性偏低，很可能源于浅势阱与气体压缩效率低下。这些发现为星系形成数值模拟施加了新的严格约束，排除了依赖晚近时期（z
  ≲ 0.5）、爆发式反馈来解释UDG形态的模型，从而将理论研究焦点转向早期并合历史、环境预处理，以及晕角动量与吸积几何结构在设定长期恒星形成上限中所起的关键作用。'
10.1093/mnras/stac2121: '本研究致力于解决星系天文学中一个关键且亟待突破的难题：在大质量星系极端外围区域开展稳健、交叉验证的恒星光度测量——这些微弱恒星晕区域蕴含着关于星系并合历史及暗物质晕性质的重要信息。尽管理论模型长期预言，外围光度分布可低弥散地示踪暗物质晕质量，但观测进展却一直受限于宽视场巡天中天光扣除、散射光及定标等方面的系统性不确定性。以往研究多依赖单一数据集，在面亮度低于μ<sub>r</sub>
  ≈ 27 mag arcsec<sup>−2</sup>时缺乏对系统误差的量化评估，致使测量结果的可重复性与物理可解释性仍存疑问。本工作通过系统比对四项独立成像巡天——HSC、DECaLS、SDSS与Dragonfly，首次构建了外围光度测光的综合性基准，将方法学挑战转化为跨设备协同增效的新机遇。


  研究团队开发了一套统一分析框架，针对红移范围0.01 < z < 0.50内的200余个大质量早型星系，提取其方位角平均面亮度轮廓。该框架为各巡天独特的噪声特性与光学伪迹定制了天光扣除流程——包括针对HSC大尺度背景梯度及DECaLS亮星散射光的新型校正算法，并利用深度拼接图像、空白天区及前向建模模拟对其进行了严格验证。尤为关键的是，团队充分利用Dragonfly望远镜超低噪声、低散射的光学系统，将其作为近邻星系（z
  < 0.05）的“金标准”，实现了前所未有的探测深度——μ<sub>r</sub> ≈ 30 mag arcsec<sup>−2</sup>。对于中红移样本，研究证实HSC可在投影长半轴达100–150
  kpc范围内可靠恢复单个星系轮廓至μ<sub>r</sub> ≈ 28.5 mag arcsec<sup>−2</sup>；而分辨率较粗的DECaLS则在超过200
  kpc处仍给出统计上一致的结果，从而支持在广阔宇宙学体积内开展集合统计研究。


  本研究取得若干具体且高影响力的重要进展：在100 kpc半径内，DECaLS与HSC所得恒星质量测量结果相互吻合，偏差不超过0.05 dex——对于如此微弱、延展的辐射而言，这一精度实属卓越；弱引力透镜分析进一步表明，在0.19
  < z < 0.50红移区间，由DECaLS与HSC共同导出的外围光度示踪量均与晕质量呈现高度紧密的相关性（对数晕质量弥散σ[log M<sub>halo</sub>]
  < 0.15 dex）。最具突破性的是，本工作证实：基于DECam的成像数据——目前已通过DECaLS覆盖逾10,000 deg<sup>2</sup>天区，未来更将随Rubin
  LSST大幅扩展——不仅可用于常规星系普查，更可作为大质量星系的*精密晕质量估测器*。此举将宽视场光学数据从被动的天图绘制工具，升华为主动探测宇宙结构形成的有力探针，为星系团搜寻、晕占据建模以及ΛCDM模型在星系尺度上的检验开辟全新路径——所有结论均建立在经多巡天实证检验的一致性基础之上。'
10.1093/mnras/stac1680: '本研究致力于解决星系天文学与星系团宇宙学中一个长期存在的挑战：寻找对暗物质晕质量具有强鲁棒性、低弥散度的示踪体，且该示踪体受观测系统误差（如视线投影效应、中心偏移及星系形成物理过程）的影响极小。尽管基于丰度的星系团搜寻方法（如redMaPPer和CAMIRA）已推动大规模宇宙学分析取得重要进展，但其在较低晕质量端的性能显著下降，且日益受到视线方向污染与中心成员判别模糊性的制约——尤其对于宿主晕质量处于星系群与星系团尺度临界过渡区的巨椭圆星系而言。Huang等人（2022）指出了一项尚未被充分探索的重要机遇：与其将恒星质量视为单一全局量，不如关注其*空间分辨*分布——特别是外晕区域——这一分布可能更干净地编码了底层引力势与晕并合历史的信息。通过聚焦于外晕恒星质量，本工作填补了观测工具箱中的一项关键空白，提出了一种物理动机明确、光度上易于获取的代理量，有效弥合了中心星系与其宿主暗物质晕之间的理论与观测鸿沟。


  研究团队充分利用了Hyper Suprime-Cam Subaru Strategic Program（HSC-SSP）提供的高质量弱引力透镜测量数据，结合深度多波段成像与高精度形状测量，为红移0.2
  < z < 0.5范围内逾一万个大质量星系（log₁₀(M⋆/M⊙) > 11.5）构建了堆叠的星系—星系透镜效应轮廓。尤为关键的是，他们采用精细的Sérsic+指数光度剖面分解方法，将恒星质量分离至不同径向环形区域，从而突破了传统CModel或Petrosian孔径的局限；并创新性地提出了“Top-N检验”——一种新颖的统计框架：在固定数密度区间内，利用透镜效应反演的晕质量约束来直接评估各类示踪体的性能。该方法无需预设参数化标度关系，即可实现Mₕ–可观测量关系中弥散度的“同质同量”直接比较。为验证物理解释的可靠性，研究团队还辅以受控的N体+半解析数值模拟，显式建模了恒星质量选样与丰度选样两类样本所受的投影效应与中心偏移影响。


  研究结果令人瞩目且具有变革性：外晕区域（特指50–100 kpc半径范围内所含恒星质量，记为M⋆,[50,100]）展现出卓越的晕质量示踪能力，在log₁₀Mᵥᵢᵣ
  ≳ 14.0范围内，其固有弥散度达σ[log₁₀Mₕ|M⋆,[50,100]] ≈ 0.13–0.15 dex，与当前最先进的光学丰度估计算法性能相当甚至更优。尤为突出的是，在较低晕质量区间（log₁₀Mᵥᵢᵣ
  ~ 13.5–13.8），M⋆,[50,100]表现出系统性*更低*的弥散度，表明其在投影效应最严重、传统方法性能急剧退化的区域具备更高保真度。至关重要的是，基于M⋆,[50,100]选样的晕所对应的透镜轮廓，与完美中心定位、孤立系统的模拟预期高度吻合——在R
  ~ 1 Mpc处无任何额外信号；而基于丰度选样的星系团则在中等尺度上呈现出清晰的10–15%剪切信号超额，直接证实了视线方向污染的存在。这种低弥散度、强物理可解释性以及对投影偏差的天然免疫性，使M⋆,[50,100]不仅具备竞争力，更在LSST与Euclid等下一代宽视场巡天开展精密宇宙学研究中展现出独特优势。本工作重新定义了恒星光作为宇宙学探针的角色——将一项经典观测量升华为植根于观测数据与数值模拟的下一代暗物质晕质量估计器。'
10.3847/1538-4357/ac6d66: '本研究致力于解决星系演化领域一个长期存在的难题：为何观测到的最亮团星系（BCGs）——宇宙中质量最大、引力主导性最强的天体系统——在晚近时期的质增速率，显著低于当前主流宇宙学数值模拟所预言的结果。尽管等级成团理论明确指出，BCGs应通过并合过程持续增长直至当今时代，但针对其*正在进行中*的并合活动，直接的观测约束却始终稀缺且多为间接证据。Hsu
  等人以一种精巧而立足于观测的策略弥补了这一空白：他们并未依赖易受简并性干扰的宽波段测光或动力学特征，而是直接识别并量化BCGs内部的*多重恒星核*——这是近期或正在进行的矮质量及中等质量并合事件无可争议的形态学示踪体。该方法提供了一个清晰、物理动机明确的中心并合率代理量，从而实现与模拟预测之间严格“同类对比”（apples-to-apples）的精确检验，并突破积分性质的局限，直接探测量子尺度上正在塑造当今BCGs的实际吸积事件。


  依托SDSS-IV MaNGA前所未有的空间分辨光谱能力，研究团队分析了一个精心筛选的79个BCGs样本，红移范围为0.06–0.15，覆盖了宇宙演化史上最近约4.5
  Gyr的时间跨度；所用MaNGA积分视场数据信噪比高，物理空间分辨率可达约1 kpc。研究人员将深度多波段成像与MaNGA提供的恒星动力学图及恒星种群分布图相结合，稳健地区分出真正共空间的多重核结构与视线方向投影或潮汐特征。尤为关键的是，他们利用当前最先进的宇宙学流体动力学模拟IllustrisTNG生成了MaNGA风格的模拟观测数据，并对真实数据与合成数据采用完全一致的分析流程，从而对检测偏差、分辨率极限及选择效应进行了严格校准。这一严谨的、经模拟标定的分析框架，成功将一项简单的形态学普查转化为对并合频率的定量、物理解释明确的测量。


  结果清晰而富有说服力：在18 kpc半径内，观测到的多重核比例为0.11 ± 0.04——这一具有统计显著性的探测明确证实，“持续吞噬”并非罕见现象，而是BCGs演化的常规特征。更引人注目的是，该观测值与IllustrisTNG模拟观测中恢复的0.08
  ± 0.04高度吻合，为该模拟对BCGs晚期组装过程的物理刻画提供了强有力的实证支持。此外，研究还揭示：成像中识别出的候选伴星核，绝大多数确为物理关联的真实系统，而非偶然投影，进一步印证了其联合测光–光谱方法的高保真度。这些发现从根本上消解了模型与观测之间长期存在的张力——表明过去4.5
  Gyr间BCGs的质量增长速率完全符合ΛCDM宇宙学框架的预期，其主导机制正是“干并合”（dry mergers），而此类并合的独特印记如今已被明确无误地捕捉。通过在核多重性与并合驱动增长之间建立起一条直接、观测锚定的联系，本工作确立了检验星系形成物理的新基准，并为借助下一代积分视场单元（IFU）巡天在全宇宙时标上探测等级成团过程开辟了一条强大路径。'
10.3847/1538-4357/ac7238: '本研究填补了星系天文学中一项长期存在的观测空白：对本星系群以外低面亮度（LSB）星系开展系统性、具有统计稳健性的表征。尽管等级式星系形成模型预言LSB星系应大量存在——且其可能蕴含有关恒星形成低效性、反馈物理机制及暗物质晕性质的关键线索——但其固有的微弱亮度却历来阻碍了大样本红移巡天的开展。此前工作多依赖于小规模、异质性强的样本，或仅能提供间接的距离估计，致使关于这类星系的宇宙学分布、质量–尺寸标度关系及其演化独特性等基本问题始终悬而未决。本研究充分利用Hyper
  Suprime-Cam战略巡天计划（HSC-SSP）所具备的前所未有的深度、分辨率与巡天面积，首次实现了对LSB星系的大视场、星等限制普查，并为其赋予直接的统计红移约束，从而将LSB星系从边缘异常体转变为可定量研究的星系种群。


  本分析整合了覆盖200 deg²天区的HSC多波段深度成像数据，并创新性地采用交叉证认技术，与NASA–SDSS星图（NASA–SDSS Atlas）进行匹配，从而为逾15,000个LSB候选体（依据面亮度阈值μ<sub>g</sub>
  > 25 mag arcsec⁻²及结构参数遴选）提供了可靠的测光红移赋值。尤为关键的是，研究团队构建了一套定制化的贝叶斯框架，用以建模选择效应并量化红移概率分布，有效规避了传统堆叠法或单红移赋值方法所固有的系统偏差。该方法结合对前景恒星、图像伪迹及高面亮度污染源的精细掩模处理，确保所得红移分布真实反映LSB星系本征总体，而非观测系统误差所致。因此，本方法论体现了现代巡天数据、历史档案资源与概率推断技术的创造性融合，专为应对超弥散天体这一特殊挑战而量身定制。


  研究结果揭示出一个丰富且结构清晰的宇宙学分布：绝大多数LSB星系位于*z* < 0.15（约500 Mpc）范围内，其中在*z* ≈ 0.03（≤100 Mpc）处呈现显著峰值，对应低质量系统（*M*<sub>*</sub>
  ≈ 10⁷–10⁸ *M*<sub>⊙</sub>），有效半径介于1–4 kpc之间——此类天体与标准的质量–尺寸关系平滑衔接。尤为引人注目的是，分布存在一条显著延伸至*z*
  ≈ 0.15的长尾，由质量更大（*M*<sub>*</sub> = 10⁸–10⁹ *M*<sub>⊙</sub>）、尺寸更广（*r*<sub>eff,g</sub>最高达≈8
  kpc）的LSB星系构成。最具突破性的是，数据首次提供了经验性证据：当恒星质量超过*M*<sub>*</sub> > 10⁸ *M*<sub>⊙</sub>时，LSB星系系统性偏离高面亮度星系外推所得的质量–尺寸趋势——表明它们并非典型矮星系或盘状星系的简单“褪色”版本，而是代表一种物理上截然不同的星系组装通道，其形成或受早期熄火、微弱恒星反馈或特殊的暗物质晕角动量历史所主导。这些发现确立了LSB星系作为一类自洽、可观测的探针，可用于深入探究极端条件下的星系形成过程，从而开辟新路径以检验ΛCDM模型预言、校准数值模拟中的重子物理、并在宇宙时标上完善星系演化理论框架。'
10.3847/1538-4357/ac6c88: '本研究聚焦近场星系形成领域一个关键矛盾：高质矮星系普遍拥有延展、古老且呈球状的恒星晕，然而其观测到的并合历史却似乎不足以通过吸积过程构建此类结构。此前的理论工作若要再现这些恒星晕，往往需引入极不合理的频繁并合事件或过度高效的潮汐剥离机制，从而在我们对低质量系统如何组装其外围恒星成分的理解中留下显著空白。Kado-Fong
  等人摒弃层级式并合框架，转而聚焦于恒星的“原位”（*in situ*）起源，彻底重构了这一问题——不再追问“这些恒星源自何处？”，而是探究“内部动力学过程如何将它们塑造成类晕构型？”。这一范式转换既具概念上的简洁性，又具备坚实的观测基础，直接回应了数值模拟与
  Dragonfly 和 Subaru/HSC 等深度成像巡天之间长期存在的分歧：后者在孤立矮星系中亦揭示出平滑、古老的外围区域。


  作者依托 FIRE-2 宇宙学“缩放模拟”（cosmological zoom-in simulations）套件——该套件以物理驱动、高分辨率地刻画恒星反馈而著称——分析了一个统计上具有代表性的样本，包含约
  50 个红移 $z=0$ 处的模拟矮星系，其恒星质量范围为 $10^{8.5} < M_\star/M_\odot < 10^{9.6}$。他们提出了一种新颖的形态学诊断方法：基于三维恒星质量张量定量表征的“本征形状”（*intrinsic
  shape*），可清晰区分“盘状”系统（具有明确的扁平化特征与旋转支撑）与“非盘状”系统（三轴、弥散主导或不规则）。尤为关键的是，他们以全时间分辨率追踪恒星轨道与年龄，从而明确识别出原位形成的晕星——这些恒星并非被瓦解卫星的残余，而是起源于盘内、并在数十亿年时间尺度上，经由反复发生的反馈驱动湍流与爆发式恒星形成所引发的动力学加热及径向迁移，最终抵达外围区域。该方法超越了简单的空间截断或运动学代理指标，将形态学特征牢固锚定于轨道演化历史与物理机制之上。


  结果极为显著且结论明确：FIRE-2 中的盘状矮星系自然演化出厚盘，同时形成球状、古老（$\gtrsim 8$ Gyr）、金属丰度低（$\langle[\mathrm{Fe}/\mathrm{H}]\rangle
  \approx -1.4$）的恒星晕，其结构与化学性质均与观测高度一致；其中高达 $\sim 30\%$ 的晕星源于原位向外迁移。相比之下，样本中近半数的非盘状矮星系则呈现混沌、气体匮乏或爆发主导的演化路径，其反馈效应完全抑制了相干盘结构的形成，最终产生蓬松、无特征的系统，无法匹配实际观测到的矮星系。这种双峰分布并非分辨率或初始条件所致的人为假象，而是直接源于反馈对气体冷却、角动量输运及恒星运动学的调控方式。因此，本工作首次以自洽、高保真度的方式证实：**内部过程**（而不仅限于外部吸积）足以构筑典型矮星系晕；同时确立“本征形状”作为一项强大且定量化的基准，可用于检验下一代数值模拟中反馈物理的建模精度。对观测者而言，该工作提出了关于外围区域年龄/金属丰度梯度与运动学不对称性的可检验预言；对理论家而言，则提供了一条清晰路径——即通过匹配的不仅是全局标度关系，更是蕴含于恒星相空间结构中的**形态学多样性**，来优化亚网格物理模型。'
10.1093/mnras/stab3586: '本项具有里程碑意义的研究直面现代宇宙学中一个关键且紧迫的挑战：星系-星系引力透镜（GGL）观测结果与星系成团性理论预言之间持续存在的张力——这一现象被广泛称为“透镜信号偏低”效应。尽管GGL已成为刻画星系-暗晕关联及暗物质分布的核心探针，但其物理解读高度依赖于对剪切测量、测光红移及星系混叠效应等系统误差的精确控制；而这些误差恰恰以难以在先验层面准确量化的特性著称。以往工作多局限于单个巡天内部的系统误差评估，因而无法排除不同巡天间共有的、未建模偏差，或由巡天特有数据处理伪迹所伪装成的物理信号。Lensing
  without Borders合作组填补了这一空白，构建了一套前所未有的、盲态的跨巡天验证框架——该框架不仅旨在检验结果的一致性，更致力于主动“发现”系统误差如何在彼此独立的数据集中协同作用，从而将系统误差评估从一项理论推演真正转变为一门经验科学。


  本分析充分利用了六组高质量成像巡天构成的独特多样化数据集——包括HSC、DES、KiDS、CFHTLenS、RCS2和CS82——它们在仪器配置、观测策略及数据处理流程上各具特色；同时统一采用BOSS光谱巡天提供的透镜星系样本（红移范围为0.1
  < z<sub>L</sub> < 0.7）。尤为关键的是，整个比较过程严格实行“盲态”操作：各团队独立利用各自的剪切星表、测光红移及掩模策略测量透镜信号振幅（ΔΣ），且在全部分析完成并锁定结果之前，彼此不交流任何中间或最终结果。系统误差预算并非仅依赖模拟推导，而是通过严格的内部一致性检验经验性地确定，包括刀切法重采样（jackknife
  resampling）、零信号检验（null tests）以及对已知观测效应（如恒星污染与混叠导致的剪切偏差）的前向建模。这一完全基于经验、保守稳健的方法论，显著区别于传统自上而下的误差建模范式，从而实现了对异构数据集间真正“苹果对苹果”的可靠比对。


  研究结果揭示，在中等红移区间内各巡天间呈现出惊人的高度一致性：对于z<sub>L</sub> < 0.43的透镜样本，在四个透镜红移区间及三个径向范围上，ΔΣ振幅的差异均优于2.3σ，有力验证了当前在此红移范围内的系统误差建模是可靠的。然而，在更高红移（z<sub>L</sub>
  > 0.43）处，透镜振幅与巡天深度之间却呈现出统计显著的3–4σ相关性——这一微妙但明确的特征，暗示着未识别的星系混叠效应及残余测光红移弥散的影响正逐渐增强。更引人深思的是，当z<sub>L</sub>
  > 0.54时，前景恒星密度开始与透镜振幅呈现相关性，表明恒星污染可能是一种此前被低估的、驱动高红移系统误差的关键因素。至关重要的是，上述所有趋势均稳稳落于经验标定的系统误差预算之内——这证明现有误差框架总体上是充分的；与此同时，该研究亦给出了迄今最严格的约束：在z
  = 0.54以下的三个关键透镜红移区间内，系统误差幅度超过15%（25%）的可能性，分别在68%（95%）置信水平下被排除。此外，观测到的透镜振幅与成团性预言之间20–30%的偏差表明，在此红移范围内，仅靠透镜系统误差尚不足以完全解释“透镜信号偏低”这一反常现象——暗示其根源更可能在于更丰富的天体物理过程或新宇宙学物理。本工作通过确立跨巡天比对作为一种强大、可扩展且经验根基坚实的新工具，用于系统误差的主动发现，为弱引力透镜科学研究树立了全新的严谨性标杆，并为Rubin
  LSST与Euclid等下一代巡天实现星系-暗晕建模的百分比级精度铺平了道路。'
10.1093/mnras/stab3297: '本研究聚焦于星系演化领域一个关键的未解之谜：超弥散星系（UDG）球状星团（GC）系统丰度所呈现的显著多样性，是否反映了其根本不同的形成路径——特别是环境、暗晕质量及熄灭历史所起的差异化作用。尽管UDG长期以来挑战着星系尺度关系的传统模型，但近期发现了一批拥有数十至数百个球状星团的GC丰度型UDG，其GC数量堪比大质量椭圆星系，这进一步激化了学界关于此类系统究竟属于“失败的巨星级星系”还是“膨胀的矮星系”的争论。此前研究受限于缺乏在单一、明确定义的星系团环境中，对GC含量与*动力学*性质之间开展具有统计稳健性且观测一致性的测量；这一空白严重制约了对各类理论模型（尤其是涉及早期或晚期环境致熄灭机制、以及暗晕质量主导的GC形成效率模型）的检验能力。本工作以英仙座星系团（Perseus
  cluster）为研究目标——这是一个动力学已充分弛豫、X射线辐射明亮、红移居中（z ≈ 0.018）的典型富星系团——首次针对一组经严格筛选、兼具GC贫乏与GC丰度两类成员的UDG样本，开展了靶向性高保真动力学表征，从而实现了对上述竞争性形成图景的直接经验判别。


  研究团队采用了一套强大的多波段观测策略：首先利用Subaru/Hyper Suprime-Cam开展深度宽视场成像，识别并结构表征了五例光谱证认的UDG，其中包括三例GC贫乏系统（N_GC
  < 10）与两例GC丰度系统（N_GC > 30）；继而使用凯克望远镜的宇宙网成像仪（KCWI）获取高灵敏度积分视场光谱，以测量恒星运动学。KCWI卓越的空间分辨率与光通量优势，使得研究团队得以在全部五个目标的半光半径（R_e
  ≈ 2–4 kpc）内精确提取速度弥散剖面，即使其面亮度极低（μ₀,g ≈ 25–27 mag arcsec⁻²）。尤为关键的是，退行速度测量确认所有目标均明确隶属于英仙座星系团（v_helio
  ≈ 5,400 km s⁻¹），彻底排除了场星系UDG研究中难以规避的投影效应干扰。数据分析结合KCWI数据立方体的前向建模与贝叶斯推断，导出了稳健的σₑ值；再通过球对称Jeans模型将其转化为R_e内的动力学质量M_dyn(<R_e)，并在建模中依据文献先验信息对速度各向异性简并性予以合理约束。这些新获得的动力学测量结果，被置于一个精心汇编的现有UDG运动学与GC计数数据集框架下进行比对分析，涵盖后发座（Coma）、室女座（Virgo）与天炉座（Fornax）等主要星系团。


  研究结果揭示出一条清晰且具物理意义的趋势：GC丰度型UDG展现出系统性更高的速度弥散——两个GC丰度系统的σₑ分别为32 ± 4 km s⁻¹与36 ± 5 km
  s⁻¹；而GC贫乏型UDG的速度弥散则介于14 ± 3 km s⁻¹至21 ± 3 km s⁻¹之间。该差异对应R_e内的动力学质量相差2.5–4倍（GC丰度型：M_dyn(<R_e)
  ≈ 1.2–2.0 × 10⁹ M⊙；GC贫乏型：0.3–0.8 × 10⁹ M⊙）。值得注意的是，其中一例GC贫乏UDG（PUDG_R24）呈现出正在发生熄灭的光谱特征——[OII]等效宽度升高且Hα辐射受抑制，表明其正于约0.5
  Gyr内向UDG相态演化，为人类提供了罕见的UDG实时形成的观测窗口。尤为关键的是，GC丰度与相空间位置（如星系团中心距离或下落速度）之间不存在相关性，从而排除了“GC丰度型UDG
  exclusively为在星系团并合前、已于高红移群环境内经历预处理并熄灭的卫星星系”这类模型。相反，σₑ与N_GC之间紧密的相关性强有力地支持暗晕质量起主导作用：GC丰度型UDG寄宿于质量更大的暗物质晕中（M_halo
  ∼ 10¹¹–10¹² M⊙），此类高质量晕不仅有利于早期高效形成球状星团，亦能维持更长的恒星形成历史，从而保留更高的恒星速度弥散。


  这些发现标志着人们对星系熄灭过程及跨质量尺度结构演化的认知取得概念性突破。本研究首次在UDG中建立起GC系统丰度与动力学质量之间直接、基于观测的关联，且完全规避了光度学示踪体或异质数据集所引入的系统偏差，从而将GC计数从一种描述性现象升华为定量诊断晕势阱强度的有效工具。这一成果重新定义了UDG的本质：它并非仅由面亮度界定的同质星系类群，而是一个内部动力学深刻编码其组装历史的多样化群体——GC丰度型UDG实为大质量星系在低面亮度域的真实对应体，而GC贫乏型UDG则更接近于遭受潮汐剥离或环境致熄灭的矮星系。对理论模拟而言，本结果对流体动力学数值模拟提出了严格约束，要求其必须同时准确再现低密度环境下GC的形成效率与恒星运动学特征；对下一代巡天项目而言，本研究验证了GC丰度作为分辨低光度系统中晕质量的高效、强健示踪体的价值，为借助Rubin
  LSST与JWST等新一代设施，系统刻画宇宙时标上暗物质—重子物质关联奠定了坚实基础。'
10.3847/1538-4357/ac1f21: '本研究旨在解决星系演化研究中一个长期存在的瓶颈问题：在宽广的恒星质量与红移范围内，缺乏统计上可靠、高保真度的星系尺寸测量——尤其是对低质量宁静星系而言，其结构特性因观测难度而始终难以精确约束。以往工作往往依赖于小样本、异质性较强的样本，或深度不足的成像数据，导致恒星形成星系与宁静星系之间的结构差异被模糊化，从而掩盖了结构标度关系随质量与环境演化的本质规律。本研究充分利用Hyper
  Suprime-Cam Subaru Strategic Program（HSC-SSP）第二版数据发布（DR2）所具备的前所未有的深度、分辨率与巡天面积优势，填补了这一关键空白——首次构建出红移范围0.2
  < z < 1.0内质量完备、涵盖百万量级星系的尺寸–质量关系（R<sub>e</sub>–M<sub>*</sub>）表征，并对恒星形成与宁静星系子样本实现了稳健分离。该数据集的规模与精度首次使我们得以明确检验：R<sub>e</sub>–M<sub>*</sub>关系是否具有普适线性形式；抑或其内在曲率真实反映了星系增长模式的物理转变。


  本分析基于约150万个星系构成的精心构建样本，覆盖天区面积约100 deg<sup>2</sup>，在z = 1.0（z = 0.6）处分别达到log(M<sub>*</sub>/M<sub>⊙</sub>)
  > 10.2（9.2）的质量完备极限，所用数据为HSC g、r、i、z及y波段高信噪比成像。星系尺寸（有效半径R<sub>e</sub>）通过多波段、点扩散函数校正的Sérsic轮廓拟合获得——依托HSC卓越的成像质量（中值视宁度约0.6″），对红移z
  ∼ 0.8、R<sub>e</sub> ≈ 0.5 kpc的星系亦可实现优于10%的尺寸测量精度。恒星质量和恒星形成分类则通过光谱能量分布（SED）拟合统一获得，采用一致的模板与尘埃衰减律；同时，通过严格的完备性修正与蒙特卡洛模拟，确保对选择效应与本征弥散的量化具有高度鲁棒性。尤为关键的是，研究团队超越了简单的线性拟合范式，将R<sub>e</sub>–M<sub>*</sub>关系建模为分段幂律形式——对每一子样本及红移切片，独立拟合拐点质量M<sub>p</sub>以及拐点上下两侧的幂律斜率。


  结果揭示出星系结构标度关系中一种显著的、依赖于质量的层级架构：恒星形成与宁静星系均遵循分段幂律型R<sub>e</sub>–M<sub>*</sub>关系，其中宁静星系的拐点质量位于log(M<sub>p</sub>/M<sub>⊙</sub>)
  ≈ 10.2–10.6，恒星形成星系则约为10.7，且该拐点仅随红移发生微弱演化。在M<sub>p</sub>以下，宁静星系呈现异常平缓的斜率R<sub>e</sub>
  ∝ M<sub>*</sub><sup>0.1</sup>，即其尺寸几乎不随质量增加；尤为引人注目的是，这些低质量宁静星系的尺寸与其同质量恒星形成星系几乎完全相当。这为“大量低质量宁静星系近期才经历熄灭”提供了强有力的实证支持——其熄灭机制很可能源于环境驱动过程，例如冲压剥离或星系际骚扰，且未伴随显著的致密化或结构重组。而在M<sub>p</sub>以上，宁静星系的斜率急剧增大至R<sub>e</sub>
  ∝ M<sub>*</sub><sup>0.6–0.7</sup>，标志着其主导增长通道已转向干并合。最具意义的是，拐点质量M<sub>p</sub>与宁静星系占比达50%所对应的恒星质量高度吻合——这一强有力的一致性表明，M<sub>p</sub>标志着星系组装模式的根本性转变：在较低质量端以原位恒星形成主导，在较高质量端则转为并合驱动的结构演化。这一统一物理解释成功将形态学、运动学与恒星形成历史整合进一个自洽的物理框架，并确立分段型R<sub>e</sub>–M<sub>*</sub>关系作为一种全新诊断工具，用于系统探查宇宙时标下熄灭机制、环境影响与等级式并合组装之间的内在关联。'
10.1093/mnras/stab2363: '本研究致力于解决星系演化领域一个长期悬而未决的核心问题：最亮团星系（BCGs）是否确为真正独特的天体物理对象——其形成由分层并合、星系吞噬或中心冷却流等特有物理过程主导；抑或仅是星系团内星系质量函数在统计意义上的自然极端值？此前研究结论相互矛盾，常受限于样本量过小、星系团选取标准不一致，或红shift范围过窄，从而掩盖了真实的演化趋势。本工作依托Hyper
  Suprime-Cam Subaru Strategic Program（HSC-SSP）前所未有的深度、分辨率与观测均匀性，填补了关键空白：首次在具有宇宙学意义的红移区间（z
  = 0.3–1.0）内，开展具备统计稳健性、大天区覆盖且红移分辨的BCG“特殊性”检验，从而对不同形成范式作出明确判别。


  分析基于一个精心构建的约5000个光学选星系团样本，覆盖天区达830 deg²，成员星系恒星质量范围为10¹¹·⁸–10¹²·⁹ M⊙，红移分布高度均匀。所有星系团成员（含BCGs）的恒星质量均采用多波段HSC测光数据，结合经严格校准的模板与贝叶斯推断方法进行谱能分布（SED）拟合，实现一致性测定。尤为关键的是，研究团队创新性地构建了一套零假设检验框架：对每个星系团，利用观测到的光度/质量函数经验拟合结果，建模其非BCG成员的质量分布，并据此计算所观测BCG质量作为该分布统计最大值出现的概率。该方法避免了对函数形式的先验假设，并系统纳入了恒星质量估计误差、成员完备性缺失及测光红移弥散等实际不确定性——其可靠性已通过大量模拟星表检验与刀切法（jackknife）重采样得到充分验证。


  结果清晰而显著：在z = 0.3–1.0全红移范围内，BCGs均呈现统计学上的显著特殊性，各红移区间的中位显著性水平均超过4σ，且该结论在所有星系团质量区间内均保持稳健。具体而言，仅有约0.3%的观测BCGs其质量与从宿主星系团成员质量分布中随机抽取的极值相容，远低于纯统计极端性所预期的约5%。这表明BCG的形成本质上是非随机的，必须引入超越简单星系团成员抽样的物理机制。一项重要细节浮现：若BCG偏离星系团光度中心或X射线中心的距离超过0.2
  R₂₀₀，其质量则不再显著偏离统计预期，暗示“中心位置”——而不仅是“亮度”——是其特殊地位不可或缺的关键要素。这些发现对理论模型施加了严格的新约束：结果强烈支持以持续、中心驱动增长为主导的形成路径——例如由动力学摩擦引导的重复并合，或活动星系核（AGN）调控下的冷却过程；而纯随机组装或早期单一块状坍缩模型则被显著削弱。


  本工作标志着星系团星系研究在概念与方法论上的双重进步，将BCG“特殊性”这一定性概念，转化为依托大规模巡天数据、可量化且具红移演化的客观指标。其影响远超星系团天体物理学范畴：通过将BCG增长锚定于星系团引力势阱，并在z
  = 1之前排除纯统计起源的可能性，本研究为半解析模型与流体动力学模拟中星系—暗晕共同演化过程的标定提供了关键实证依据。此外，该方法对空间偏移的高灵敏度，亦为探测星系团动力学状态、并合历史及AGN反馈几何结构开辟了新途径。对于LSST与Euclid等未来巡天项目，本框架确立了一个可扩展、以观测为基础的基准，用以检验星系熄灭、质量组装与环境效应如何在宇宙大尺度结构的核心区域相互交织。'
10.1093/mnras/stab2589: '本研究致力于解决现代天文学中一个日益突出且至关重要的挑战：在PB量级成像巡天数据中自动识别稀有、意外或物理性质极端的天体现象。随着Rubin
  LSST等新一代观测设施即将每年产出数十亿幅星系图像，依赖预定义类别与标注训练样本的传统模板匹配或监督分类方法，在本质上已难以胜任真正新奇天体的发现任务。Storey-Fisher等人填补了这一空白，提出了一种创新性的全无监督框架——该框架不预设任何异常类型先验知识，而是直接从数据中学习“正常”星系形态的内在流形结构。研究以Hyper
  Suprime-Cam（HSC）巡天——一项覆盖面积逾1000 deg²、具有高深度与高分辨率的光学成像数据集——为靶标，构建了一套可扩展、物理模型无关的分析流程；该流程以提升发现潜力为首要目标，而非追求分类完备性，从而为大数据时代的偶然性科学开辟了一条全新路径。


  研究团队在HSC宽场巡天（Wide layer）中精心筛选出近百万幅星系切图图像进行训练，所有样本均满足良好分辨、未饱和且非恒星源等严格质量标准。尤为关键的是，作者充分利用了生成对抗网络（GAN）架构的双重组件实现异常检测：一方面利用生成器的重构误差（量化真实图像被合成的难易程度），另一方面则借助判别器所学习到的特征空间嵌入（捕捉偏离主导形态分布的细微偏差）。通过系统性基准测试，作者证实判别器的隐空间表征对具有天体物理意义的离群体敏感度显著优于仅基于生成器的残差方法，亦优于传统卷积自编码器——由此确立了对抗网络在天文学中一种全新的应用范式。为进一步增强可解释性，作者创新性地设计了两阶段表征流程：首先计算真实图像与WGAN重构图像之间的像素级残差，继而通过专用卷积自编码器对残差进行压缩，并最终采用UMAP进行无监督聚类——从而在无需人工标注的前提下，实现对异常子类直观、低维的探索。


  该方法成功识别出约13,000个高置信度异常星系样本，仅占输入星系星表的约1.3%，却在稀有形态天体上实现了数量级级别的富集。目视检验与后续分析揭示了一批引人注目的候选体，包括伴有多条微弱潮汐尾的晚期并合星系、表面亮度极高的致密星暴星系，以及呈现异常不对称结构、暗示近期相互作用或反馈驱动扰动的特殊系统。尤为值得注意的是，对其中一例高分异常体开展的光谱证认确认其为一个贫金属矮星系，其内部存在一个异常蓝、且金属丰度更高的H II区——这凸显了该技术识别出真正奇异天体的能力，而此类天体往往被传统选源标准所遗漏。研究团队已公开发布异常评分星表、开源代码及交互式网络可视化平台（weirdgalaxi.es），确保成果在学界广泛可用且可复现。本工作代表了概念与技术层面的重大跃进：它将生成建模从一种合成数据工具，升华为一台真正的科学发现引擎；证明了深度无监督学习不仅能忠实复现天文数据，更能主动照亮其中最具信息量的离群体——从而为当前及未来各类宽视场巡天中的AI辅助探索奠定了更为坚实的基础。'
10.3847/1538-4357/ac15f0: '本研究致力于解决低面亮度星系（LSBGs）研究中一个长期存在且至关重要的科学空白：其本征三维结构。尽管LSBGs已成为探索暗物质主导、气体丰沛、光度微弱等极端物理环境下星系形成机制的关键探针，但其物理起源仍存在激烈争论——观点涵盖“失败的银河系卫星星系”、“夭折的巨椭圆星系”，乃至径向迁移或潮汐搅拌的产物。尤为关键的是，以往关于星系形状的分析，或忽视了面亮度受限巡天固有的选择效应，或将投影效应与真实的结构多样性混为一谈，致使LSBGs本征形状分布长期缺乏可靠约束，其对形成机制的物理解读亦因而模糊不清。本工作直面上述观测偏差，首次在多个独立大天区巡天数据基础上，建立了稳健、自洽的LSBGs本征形状系综推断框架，从而将星系形状这一参数，从定性描述提升为定量判别星系形成物理过程的关键诊断工具。


  作者开创性地构建了一套新颖的前向建模框架，联合拟合来自三组互补数据集的逾21,000个LSBGs的投影椭率与表观面亮度观测分布：Hyper Suprime-Cam
  Subaru Strategic Program（781个星系）、Dark Energy Survey（20,977个）以及Legacy Survey（188个H
  I选源系统）。该模型的核心创新在于，明确将各巡天特有的面亮度极限与探测阈值作为似然函数的内在组成部分，从而确保所推断出的本征形状并非选择效应的人为产物，而是真实反映底层星系总体的统计特性。该方法在统一的统计框架下协同利用光学形态信息与面亮度灵敏度，并辅以严格的蒙特卡洛检验及跨巡天方法学与红移范围（z
  < 0.3）的一致性验证。分析进一步区分了红序与蓝序LSBGs，并将结果与高面亮度矮星系及当前最先进的宇宙学流体动力学模拟（包括IllustrisTNG、EAGLE与FIRE-2）中的类LSBGs模拟样本进行基准比对。


  结果表明，LSBGs绝大多数可被优异描述为扁椭球体，其中位本征轴比（c/a）为0.56 ± 0.03，其压扁程度弥散符合以q ≈ 0.55为中心的对数正态分布。尤为引人注目的是，红序与蓝序LSBGs之间未发现具有统计显著性的形状差异——这暗示恒星形成历史并未导致其整体形状发生重大分化，从而与“环境压缩或冲压剥离主导星系熄灭”这一预期相悖。此外，LSBGs明显比质量相当的高面亮度矮星系更厚（即压扁程度更低），后者中位c/a约为0.45；这一显著区别指向二者在动力学组装历史上的根本性差异。最具说服力的是，观测所得的形状分布与如下模拟预言高度吻合：LSBGs主要通过恒星形成的*原位*径向迁移延伸至大半径处而形成；而以潮汐瓦解或早期坍缩为主导的模型则系统性地预言更扁平或更三轴的构型，与观测数据不符。


  这些发现标志着概念层面的重大跃进：本征形状首次不再仅作为描述性统计量，而是成为一种决定性、且严格基于观测的星系形成路径约束。其与径向迁移情景的高度一致，凸显了内禀缓变过程（secular
  processes）即使在宇宙最低密度环境中亦具关键作用，同时挑战了将外部环境触发机制视作LSBGs成因主导因素的传统叙事。本工作通过将理论模型锚定于一个经系统偏差校正的可观测量，不仅为下一代宇宙学模拟树立了新的基准，也为未来面向低面亮度结构的深度成像与积分场光谱（IFU）巡天的设计提供了重要指导。最终，该研究确证：LSBGs并非奇异的离群体，而是标准重子物理在极端面亮度条件下自然演化的产物——由此开启了一扇崭新的、以几何视角为驱动的窗口，用以探究星系如何在宇宙时标上构筑其外围恒星晕。'
10.3847/1538-4357/ac0896: '本研究聚焦于银河系黑洞种群统计学中一个引人入胜且长期悬而未决的关键问题：游荡型中等质量黑洞（IMBHs）——这类天体可能在等级式星系并合过程中，从矮星系卫星系统中被剥离而出，因而迄今仍难以捉摸。尽管超大质量黑洞稳居星系核区中心，而恒星级质量黑洞正通过引力波日益频繁地被探测到，但作为连接这两类极端质量黑洞之间关键质量间隙的IMBHs，其观测证据依然匮乏。对IMBHs的可靠探测对于检验黑洞种子形成、生长机制以及低质量系统中动力学演化理论至关重要；然而，迄今为止，尚未在银河系晕中发现任何经动力学确证、无可争议的IMBH。Greene等人（2021）开创性地提出一种新颖的多波段搜寻策略，将探测范式由依赖微弱且暂现的直接吸积辐射信号，转向搜寻IMBHs可能通过引力束缚形成的、具有持久性与运动学相干性的恒星系统——即尺度约1
  pc、包含500–5000颗恒星的超致密星团（HCCs）。


  研究团队采用了一种富有创意且以数据驱动的方法：将盖亚第二期数据发布（Gaia DR2）提供的高精度天体测量数据，与暗能量相机遗产巡天（DECaLS）获取的深度宽视场光学成像数据进行交叉比对。他们构建了专门设计的筛选准则，用于识别那些角尺度紧凑、无法分辨、且自行弥散度极小的恒星过密区域——此类特征正是受不可见大质量扰动源引力束缚的致密系统的典型标志；同时，他们应用严谨的统计背景建模方法，以有效区分真实候选体与随机投影叠加或图像伪迹。尤为关键的是，该团队基于半解析卫星演化模型SatGen，将搜寻灵敏度锚定于现实的理论预期之上：SatGen模拟了矮星系向银河系并合的吸积历史，并预测——若每个并合矮星系均曾拥有中心黑洞，则银河系晕中可能存有高达约100个游荡型IMBH（质量范围为10³–10⁵
  M⊙）。这一前向建模框架使研究者得以将“未探测到”的结果转化为具有明确物理意义的IMBH占据率上限。


  尽管在所覆盖的天区（约5,000 deg²）内未发现确凿无疑的HCC候选体，但这一零结果极具科学价值：它稳健地排除了矮星系前身天体中IMBH占据率为100%的可能性，从而首次为银河系晕中“黑洞化石”的普遍性提供了观测约束。更重要的是，本研究建立了一套强大而崭新的方法论——通过精密天体测量与深度测光的协同融合，借助恒星运动学印记来探查不可见的大质量天体——并明确了未来取得突破的关键路径。作者特别指出，对HCC结构参数（如尺度分布、光度函数及残余恒星占比）认知的进一步提升，将在盖亚第四期数据发布（Gaia
  DR4）和鲁宾时空遗产巡天（Rubin LSST）等下一代巡天项目中显著增强探测灵敏度。本工作通过将“未探测到”转化为下一代搜寻工作的坚实基础，充分彰显了创新性数据融合与理论驱动型巡天设计如何共同推动黑洞天体物理学前沿问题的深入探索。'
