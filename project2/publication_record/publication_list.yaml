- title: A Nonparametric Morphological Analysis of Hα Emission in Bright Dwarfs Using
    the Merian Survey
  year: 2024
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ad6861
  arxiv_id: ''
  abstract: Using medium-band imaging from the newly released Merian Survey, we conduct
    a nonparametric morphological analysis of Hα emission maps and stellar continua
    for a sample of galaxies with <inline-formula> <mml:math overflow="scroll"><mml:mn>8</mml:mn><mml:mo>≲</mml:mo><mml:mi>log</mml:mi><mml:mo
    stretchy="false">(</mml:mo><mml:msub><mml:mrow><mml:mi>M</mml:mi></mml:mrow><mml:mrow><mml:mo>⋆</mml:mo></mml:mrow></mml:msub><mml:mrow><mml:mo
    stretchy="true">/</mml:mo></mml:mrow><mml:msub><mml:mrow><mml:mi>M</mml:mi></mml:mrow><mml:mrow><mml:mo>⊙</mml:mo></mml:mrow></mml:msub><mml:mo
    stretchy="false">)</mml:mo><mml:mo>&lt;</mml:mo><mml:mn>10.3</mml:mn></mml:math>
    </inline-formula> at 0.064 &lt; z &lt; 0.1. We present a novel method for estimating
    the stellar continuum emission through the Merian Survey's N708 medium-band filter,
    which we use to measure Hα emission and produce Hα maps for our sample of galaxies
    with seven-band Merian photometry and available spectroscopy. We measure nonparametric
    morphological statistics for the Hα and stellar continuum images, explore how
    the morphology of the Hα differs from the continuum, and investigate how the parameters
    evolve with the galaxies' physical properties. In agreement with previous results
    for more massive galaxies, we find that the asymmetry of the stellar continuum
    increases with specific star formation rate (sSFR), and we extend the trend to
    lower masses, also showing that it holds for the asymmetry of the Hα emission.
    We find that the lowest-mass galaxies with the highest sSFR have Hα emission that
    is consistently heterogeneous and compact, while the less active galaxies in this
    mass range have Hα emission that appears diffuse. At higher masses, our data do
    not span a sufficient range in sSFR to evaluate whether similar trends apply.
    We conclude that high sSFRs in low-mass galaxies likely result from dynamical
    instabilities that compress a galaxy's molecular gas to a dense region near the
    center.
