- title: Galaxy Clustering in the Mira-Titan Universe. I. Emulators for the Redshift
    Space Galaxy Correlation Function and Galaxy-Galaxy Lensing
  year: 2023
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/acd92f
  arxiv_id: '2302.12379'
  abstract: We construct accurate emulators for the projected and redshift space galaxy
    correlation functions and excess surface density as measured by galaxy-galaxy
    lensing, based on halo occupation distribution modeling. Using the complete Mira-Titan
    suite of 111 N-body simulations, our emulators vary over eight cosmological parameters
    and include the effects of neutrino mass and dynamical dark energy. We demonstrate
    that our emulators are sufficiently accurate for the analysis of the Baryon Oscillation
    Spectroscopic Survey DR12 CMASS galaxy sample over the range 0.5 ≤ r ≤ 50 h <SUP>-1</SUP>
    Mpc. Furthermore, we show that our emulators are capable of recovering unbiased
    cosmological constraints from realistic mock catalogs over the same range. Our
    mock catalog tests show the efficacy of combining small-scale galaxy-galaxy lensing
    with redshift space clustering and that we can constrain the growth rate and σ
    <SUB>8</SUB> to 7% and 4.5%, respectively, for a CMASS-like sample using only
    the measurements covered by our emulator. With the inclusion of a cosmic microwave
    background prior on H <SUB>0</SUB>, this reduces to a 2% measurement of the growth
    rate.
