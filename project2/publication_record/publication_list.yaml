- title: 'Zangetsu: A Candidate Isolated, Quiescent, and Backsplash Ultra-diffuse
    Galaxy in the COSMOS Field'
  year: 2026
  journal: The Astrophysical Journal
  doi: 10.3847/1538-4357/ae20f5
  arxiv_id: ''
  abstract: Deep imaging surveys have changed our view of the low surface brightness
    (LSB) Universe. The "renaissance" of the LSB galaxy population, as a prime example
    of this recent development, continues to challenge our understanding of galaxy
    formation. Here, we report the serendipitous discovery of Zangetsu, an isolated,
    quiescent, and distorted ultra-diffuse galaxy (UDG) candidate in the COSMOS field,
    using images from the Hyper Suprime-Cam Subaru Strategic Program (HSC-SSP). Zangetsu
    exhibits an extremely low central surface brightness (μ<SUB>0,g</SUB> = 26.60
    ± 0.01 mag arcsec<SUP>−2</SUP>), a very shallow inner surface brightness profile
    (n<SUB>Sersic</SUB> = 0.40 ± 0.01), and a large angular size (R<SUB>e</SUB> ≍
    10<inline-formula> <mml:math><mml:mover><mml:mrow><mml:mo>.</mml:mo></mml:mrow><mml:mrow><mml:mtext>″</mml:mtext></mml:mrow></mml:mover></mml:math>
    </inline-formula>44). Surprisingly, Zangetsu also has a quiescent stellar population
    (g − i = 0.96), an unusually elongated shape (b/a ∼ 0.25), and mild morphological
    asymmetry, making it a rare case among known UDGs. Surface brightness fluctuation
    analysis of HSC and Hubble Space Telescope images only provides a distance lower
    limit of D &gt; 25.4 Mpc (thus, R<SUB>e</SUB> &gt; 1.38 kpc). However, Zangetsu
    remains an extreme outlier in the luminosity─size relation of known LSB galaxies,
    suggesting that it could be an exceptionally large and/or diffuse system. Classic
    internal or external UDG formation mechanisms alone struggle to explain such a
    system. A backsplash origin may account for its isolation and quiescent nature.
    This finding also raises the possibility that current works may overlook similarly
    extreme, elongated systems that could further our understanding of the LSB Universe.
