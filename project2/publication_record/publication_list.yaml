- title: Cluster cosmology without cluster finding
  year: 2024
  journal: Monthly Notices of the Royal Astronomical Society
  doi: 10.1093/mnras/stae882
  arxiv_id: ''
  abstract: We propose that observations of supermassive galaxies contain cosmological
    statistical constraining power similar to conventional cluster cosmology, and
    we provide promising indications that the associated systematic errors are comparably
    easier to control. We consider a fiducial spectroscopic and stellar mass complete
    sample of galaxies drawn from the Dark Energy Spectroscopic Instrument (DESI)
    and forecast how constraints on Ω<SUB>m</SUB>-σ<SUB>8</SUB> from this sample will
    compare with those from number counts of clusters based on richness λ. At fixed
    number density, we find that massive galaxies offer similar constraints to galaxy
    clusters. However, a mass-complete galaxy sample from DESI has the potential to
    probe lower halo masses than standard optical cluster samples (which are typically
    limited to λ ≳ 20 and M<SUB>halo</SUB> ≳ 10<SUP>13.5</SUP> M<SUB>⊙</SUB> h<SUP>-1</SUP>);
    additionally, it is straightforward to cleanly measure projected galaxy clustering
    w<SUB>p</SUB> for such a DESI sample, which we show can substantially improve
    the constraining power on Ω<SUB>m</SUB>. We also compare the constraining power
    of M<SUB>*</SUB>-limited samples to those from larger but mass-incomplete samples
    [e.g. the DESI Bright Galaxy Survey (BGS) sample]; relative to a lower number
    density M<SUB>*</SUB>-limited samples, we find that a BGS-like sample improves
    statistical constraints by 60 per cent for Ω<SUB>m</SUB> and 40 per cent for σ<SUB>8</SUB>,
    but this uses small-scale information that will be harder to model for BGS. Our
    initial assessment of the systematics associated with supermassive galaxy cosmology
    yields promising results. The proposed samples have a ~10 per cent satellite fraction,
    but we show that cosmological constraints may be robust to the impact of satellites.
    These findings motivate future work to realize the potential of supermassive galaxies
    to probe lower halo masses than richness-based clusters and to potentially avoid
    persistent systematics associated with optical cluster finding.
